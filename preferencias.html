<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escolha de disciplinas</title>
<script>window.GFI_APP='gd';window.GFI_LS=[]</script>
<script src="config.js?v=6"></script>
<script src="gfi.js?v=6"></script>
<style>
:root{--bg:#EEF2F5;--card:#fff;--ink:#0F1B2A;--mut:#5B6878;--line:#DCE4EA;--ac:#0F6E7A;--ac-s:#DDF1F1;--lock:#8A6A12;--lock-s:#FBF1D9;--bad:#B92F26;--ok:#146C45}
@media (prefers-color-scheme:dark){:root{--bg:#0B131B;--card:#131F2A;--ink:#E8EEF3;--mut:#93A3B2;--line:#23313E;--ac:#4CC7C2;--ac-s:#12302F;--lock:#EAB35A;--lock-s:#35280F;--bad:#FF8F86;--ok:#5FD09B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.band{border-radius:18px;padding:22px 26px;color:#F3F7FA;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:radial-gradient(500px 240px at 90% 0%,rgba(76,199,194,.35),transparent 60%),linear-gradient(120deg,#0B1D2E,#10294A 60%,#134B5A);box-shadow:0 12px 30px -14px rgba(15,27,42,.4)}
.band h1{margin:0;font-size:clamp(24px,4vw,34px);display:flex;align-items:center;gap:12px}
.band h1 .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
.lead{margin:16px 2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bar input{flex:1;min-width:200px}
.cont{font-weight:700;color:var(--ac);white-space:nowrap}
button{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.55;cursor:default}
.mod{margin-top:18px}
.mod h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.mod h2 small{font-weight:400;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.disc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:400;width:100%}
.disc:hover{border-color:var(--ac)}
.disc .ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:#fff;font-size:14px;font-weight:700}
.disc.on{border-color:var(--ac);background:var(--ac-s)}
.disc.on .ck{background:var(--ac);border-color:var(--ac)}
.disc b{display:block;font-size:14.5px;line-height:1.3}
.disc span.meta{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.disc.lock{cursor:default;background:var(--lock-s);border-color:transparent}
.disc.lock .ck{border-color:var(--lock);color:var(--lock)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--lock);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:70px}
.foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.msg{font-weight:700}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.muted{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
td input{width:100%;font:inherit;font-size:12.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.s{background:var(--ac-s);color:var(--ac)}.pill.n{background:var(--lock-s);color:var(--lock)}
a{color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
  <header class="band">
    <h1><span class="ic">✓</span><span id="titulo">Escolha de disciplinas</span></h1>
    <a id="voltar" href="index.html" style="display:none;background:#fff;color:#0E2233;border-radius:999px;padding:9px 18px;font-weight:700;text-decoration:none">Voltar ao painel</a>
  </header>
  <div id="app"><p class="lead muted">Carregando…</p></div>
</div>
<script>
(function(){
  var URL_PREF='https://fabio-iba.github.io/gestao-fabio-iba/preferencias.html';
  var app=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
  function chaveDisc(n){return norm(n).replace(/[^a-z0-9]/g,'')}
  function codProf(pid){var s=String(pid)+'|gd-entregas',x=7;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x.toString(36).slice(-5)}
  function dataBR(iso){if(!iso)return '';var d=new Date(iso),p=function(n){return String(n).padStart(2,'0')};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}
  function sigla(nome,matriz){var n=norm(nome),s=/psicolog/.test(n)?'PSIORG':/administra/.test(n)?'ADM/PGER':/felicidade/.test(n)?'CFEL':/saude mental/.test(n)?'GSMT':/recursos humanos/.test(n)?'RH':/institucion/.test(n)?'Institucional':nome;return s+(matriz?' '+matriz:'')}
  // disciplinas sem matriz indicada pertencem à Matriz 2026N (padrão do painel)
  function matrizDe(d){return (d&&d.matriz)||'2026N'}
  // fora da escolha: disciplinas ECT e as marcadas como sem aula ao vivo
  function foraDaEscolha(d){return !!d.semAoVivo||/^\s*ECT\b/i.test(d.nome||'')}
  function nomeCurto(n){var p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1]:p[0]||''}
  function lista(arr){var o={};(arr||[]).forEach(function(d){o[d.id]=d.data});return o}

  var m=/[#?&]p=([\w-]+)\.([a-z0-9]+)/i.exec((location.hash||'')+'&'+(location.search||''));
  var PID=m&&codProf(m[1])===m[2].toLowerCase()?m[1]:null;
  if(m&&!PID){app.innerHTML='<div class="card"><b>Link inválido.</b> <span class="muted">Confira o link enviado pela coordenação.</span></div>';return}
  if(PID){try{localStorage.setItem('gdPortal',PID+'.'+codProf(PID))}catch(e){}}
  // filtro escolhido pela coordenação ao enviar o link (matrizes, cursos, anos, módulos)
  var FILTRO=null;try{var fm0=/[#&]f=([^&]+)/.exec(location.hash||'');if(fm0)FILTRO=JSON.parse(decodeURIComponent(fm0[1]))}catch(e){FILTRO=null}
  function passaFiltro(d,F){if(!F)return true;
    if(F.m&&F.m.length&&F.m.indexOf(matrizDe(d))<0)return false;
    if(F.c&&F.c.length&&F.c.indexOf(d.cursoId)<0)return false;
    if(F.a&&F.a.length&&F.a.indexOf(d.ano||'')<0)return false;
    if(F.o&&F.o.length&&F.o.indexOf(d.modulo||'')<0)return false;
    return true}

  // agrupa as disciplinas: mesmo nome no mesmo módulo = uma escolha (vale para todos os cursos e matrizes)
  function unidades(D,C,F){
    var g={};
    Object.keys(D).forEach(function(id){var d=D[id];if(!d||!d.nome||!passaFiltro(d,F)||foraDaEscolha(d))return;
      var k=chaveDisc(d.nome)+'|'+(d.modulo||'');
      var u=g[k]=g[k]||{id:k,chave:chaveDisc(d.nome),nome:d.nome,modulo:d.modulo||'Sem módulo',anos:{},cursos:{},horas:{}};
      if(d.ano)u.anos[d.ano]=1;if(d.hora)u.horas[d.hora]=1;
      var c=C[d.cursoId];u.cursos[sigla(c?c.nome:'',matrizDe(d))]=1;if(c&&/institucion/.test(norm(c.nome)))u.inst=true});
    return Object.keys(g).map(function(k){var u=g[k];u.ano=Object.keys(u.anos).sort().join(', ');u.curso=Object.keys(u.cursos).sort().join(' · ');u.hora=Object.keys(u.horas).sort().join(', ');return u})
      .sort(function(a,b){return a.modulo.localeCompare(b.modulo,'pt-BR',{numeric:true})||a.nome.localeCompare(b.nome,'pt-BR')});
  }
  function fixas(H){var f={};Object.keys(H).forEach(function(pid){var x=(H[pid]&&H[pid].fixas)||{};(x.ead||[]).concat(x.estendida||[]).forEach(function(k){(f[k]=f[k]||[]).push(pid)})});return f}

  if(PID) professor(); else coordenador();

  /* ---------------- professor ---------------- */
  function professor(){
    GFI.api('listMany',{cols:['disciplinas','cursos','pessoas','habilitacoes','escolhas']}).then(function(r){
      var D=lista(r.disciplinas),C=lista(r.cursos),P=lista(r.pessoas),H=lista(r.habilitacoes),E=lista(r.escolhas)[PID]||null;
      var eu=P[PID]||{nome:PID},FX=fixas(H),us=unidades(D,C,FILTRO),sel={},q='',fm='';
      if(E&&E.lista)E.lista.forEach(function(x){sel[x.id]=1});
      us.forEach(function(u){var f=FX[u.chave]||[];u.minha=f.indexOf(PID)>=0;u.outro=!u.minha&&f.length>0;u.fixoNomes=f.filter(function(x){return x!==PID}).map(function(x){return nomeCurto((H[x]&&H[x].nome)||x)}).join(', ');if(u.minha)sel[u.id]=1;if(u.outro)delete sel[u.id]});
      var mods=[];us.forEach(function(u){if(mods.indexOf(u.modulo)<0)mods.push(u.modulo)});
      var obs=E&&E.obs||'';
      var DIAS=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira'],dias={};
      // professor regente já tem todos os dias disponíveis: não escolhe dias
      var REGENTE=/regente/i.test(eu.papel||'');if(REGENTE)DIAS.forEach(function(x){dias[x]=1});(E&&E.dias||[]).forEach(function(x){dias[x]=1});
      function desenhar(){
        var n=Object.keys(sel).length,nq=norm(q);
        var vis=us.filter(function(u){return (!fm||u.modulo===fm)&&(!nq||norm(u.nome).indexOf(nq)>=0)});
        var h='<p class="lead">Prof(a). <b>'+esc(eu.nome)+'</b> · marque as disciplinas que você quer trabalhar e clique em <b>Enviar escolhas</b>.</p>'+
          (E&&E.enviadoEm?'<div class="card" style="margin-top:0"><span class="msg ok">Escolhas enviadas em '+dataBR(E.enviadoEm)+'.</span> <span class="muted">Você pode alterar e enviar de novo quando quiser.</span></div>':'')+
          '<div class="bar"><input id="q" type="search" placeholder="Buscar disciplina" value="'+esc(q)+'"><select id="fm"><option value="">Todos os módulos</option>'+mods.map(function(x){return '<option'+(x===fm?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select><span class="cont">'+n+' marcada'+(n===1?'':'s')+'</span></div>';
        mods.forEach(function(md){var it=vis.filter(function(u){return u.modulo===md});if(!it.length)return;
          h+='<section class="mod"><h2>'+esc(md)+' <small>'+it.length+' disciplina'+(it.length===1?'':'s')+'</small></h2><div class="grid">'+it.map(function(u){
            var on=!!sel[u.id],cls='disc'+(on?' on':'')+(u.outro||u.minha?' lock':'');
            var meta=[u.inst?'Institucional':'',u.ano?u.ano+' ano':'',u.hora].filter(Boolean).join(' · ');
            var tag=u.outro?'<span class="tag">Fixa: '+esc(u.fixoNomes)+'</span>':u.minha?'<span class="tag">Fixa: '+esc(nomeCurto(eu.nome))+'</span>':'';
            return '<button type="button" class="'+cls+'" data-id="'+esc(u.id)+'"'+(u.outro||u.minha?' aria-disabled="true"':'')+' aria-pressed="'+on+'"><span class="ck">'+(on?'✓':u.outro?'🔒':'')+'</span><span><b>'+esc(u.nome)+'</b><span class="meta">'+esc(meta)+'</span>'+tag+'</span></button>'}).join('')+'</div></section>'});
        if(!vis.length)h+='<div class="card muted">Nenhuma disciplina encontrada.</div>';
        if(!REGENTE)h+='<div class="card"><b>Dias da semana disponíveis para dar aula</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">'+DIAS.map(function(x){var on=!!dias[x];return '<button type="button" class="dia" data-dia="'+x+'" aria-pressed="'+on+'" style="padding:8px 16px;font-weight:600;'+(on?'background:var(--ac);border-color:var(--ac);color:#fff':'')+'">'+(on?'✓ ':'')+x+'</button>'}).join('')+'</div></div>';
        h+='<div class="card"><label for="obs"><b>Observação</b> <span class="muted">(opcional)</span></label><textarea id="obs" maxlength="2000" placeholder="Ex.: prefiro disciplinas do 2º ano">'+esc(obs)+'</textarea><div class="foot"><button class="pri" id="enviar">Enviar escolhas</button><span class="msg" id="msg"></span></div></div>';
        app.innerHTML=h;
        var qi=document.getElementById('q');qi.oninput=function(){q=qi.value;var p=qi.selectionStart;desenhar();var n2=document.getElementById('q');n2.focus();n2.setSelectionRange(p,p)};
        document.getElementById('fm').onchange=function(e){fm=e.target.value;desenhar()};
        document.getElementById('obs').oninput=function(e){obs=e.target.value};
        document.getElementById('enviar').onclick=enviar;
      }
      app.addEventListener('click',function(e){var dd=e.target.closest('.dia');if(dd){var x=dd.getAttribute('data-dia');if(dias[x])delete dias[x];else dias[x]=1;desenhar();return}});
      app.addEventListener('click',function(e){var b=e.target.closest('.disc');if(!b||b.getAttribute('aria-disabled'))return;var id=b.getAttribute('data-id');if(sel[id])delete sel[id];else sel[id]=1;desenhar()});
      function enviar(){
        var bt=document.getElementById('enviar'),msg=document.getElementById('msg');
        var dl=DIAS.filter(function(x){return dias[x]});if(!dl.length){msg.className='msg bad';msg.textContent='Marque pelo menos um dia da semana disponível.';return}bt.disabled=true;msg.className='msg';msg.textContent='Enviando…';
        var l=us.filter(function(u){return sel[u.id]&&!u.outro}).map(function(u){return {id:u.id,chave:u.chave,nome:u.nome,modulo:u.modulo,cursos:u.curso,ano:u.ano,fixa:u.minha}});
        GFI.api('escolhas',{lista:l,obs:obs,dias:dl,pid:PID+'.'+codProf(PID)}).then(function(r){E={lista:l,obs:obs,dias:dl,enviadoEm:r.enviadoEm};desenhar();var m2=document.getElementById('msg');m2.className='msg ok';m2.textContent='Escolhas enviadas ('+r.total+' disciplina'+(r.total===1?'':'s')+'). Obrigado!'},
          function(err){bt.disabled=false;msg.className='msg bad';msg.textContent='Não foi possível enviar ('+(err&&err.message||'erro')+'). Tente de novo.'});
      }
      desenhar();
    },function(err){app.innerHTML='<div class="card"><span class="msg bad">Não foi possível carregar as disciplinas.</span> <span class="muted">'+esc(err&&err.message)+'</span></div>'});
  }

  /* ---------------- coordenação: filtros, professores e envio ---------------- */
  function coordenador(){
    document.getElementById('titulo').textContent='Escolha de disciplinas · envio';
    document.getElementById('voltar').style.display='';
    GFI.api('listMany',{cols:['pessoas','escolhas','disciplinas','cursos','escolhasEnvio']}).then(function(r){
      var P=lista(r.pessoas),E=lista(r.escolhas),D=lista(r.disciplinas),C=lista(r.cursos),EV=lista(r.escolhasEnvio);
      var ps=Object.keys(P).filter(function(id){var p=P[id];return p&&p.nome&&!/mediador/i.test(p.papel||'')}).sort(function(a,b){return P[a].nome.localeCompare(P[b].nome,'pt-BR')});
      var op={m:{},c:{},a:{},o:{}};
      Object.keys(D).forEach(function(id){var d=D[id];op.m[matrizDe(d)]=1;if(d.cursoId)op.c[d.cursoId]=1;if(d.ano)op.a[d.ano]=1;if(d.modulo)op.o[d.modulo]=1});
      var ROT={m:'Matrizes',c:'Cursos',a:'Anos',o:'Módulos'};
      function rot(t,v){return t==='c'?(C[v]?C[v].nome:v):t==='m'?'Matriz '+v:v}
      var F={m:{},c:{},a:{},o:{}},SP={},fila=null;
      function arr(o){return Object.keys(o)}
      function filtroLink(){var f={};['m','c','a','o'].forEach(function(t){var x=arr(F[t]);if(x.length)f[t]=x});return arr(f).length?f:null}
      function linkDe(id){var f=filtroLink();return URL_PREF+'#p='+id+'.'+codProf(id)+(f?'&f='+encodeURIComponent(JSON.stringify(f)):'')}
      function contaDisc(){var f=filtroLink(),k={};Object.keys(D).forEach(function(id){var d=D[id];if(d&&d.nome&&passaFiltro(d,f)&&!foraDaEscolha(d))k[chaveDisc(d.nome)+'|'+(d.modulo||'')]=1});return arr(k).length}
      function chips(t){return '<div class="card" style="margin-top:10px"><b>'+ROT[t]+'</b> <span class="muted" style="font-size:12.5px">(nenhum marcado = todos)</span><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'+
        arr(op[t]).sort(function(x,y){return rot(t,x).localeCompare(rot(t,y),'pt-BR',{numeric:true})}).map(function(v){var on=!!F[t][v];return '<button type="button" class="chip" data-t="'+t+'" data-v="'+esc(v)+'" style="padding:6px 14px;font-weight:600;'+(on?'background:var(--ac);border-color:var(--ac);color:#fff':'')+'">'+esc(rot(t,v))+'</button>'}).join('')+'</div></div>'}
      function corpo(id){return 'Prezado(a) professor(a),\n\nEstamos planejando a alocação docente das próximas disciplinas. Por gentileza, acesse o link abaixo e selecione aquelas com as quais você tem mais afinidade e gostaria de trabalhar.\nPedimos que marque o maior número possível de disciplinas, pois isso nos permitirá realizar a alocação de acordo com a sua área de conhecimento.\nApós concluir a seleção, clique em Enviar.\nAgradecemos a colaboração!\n\n'+linkDe(id)+'\n\nAtenciosamente,\nProf. Fabio Luiz Iba\nCoordenador de Curso EAD\n44 99861-3528\nfabio.iba@unicesumar.edu.br'}
      function mailto(id){var p=P[id];return 'mailto:'+encodeURIComponent(p.email||'')+'?subject='+encodeURIComponent('Escolha de disciplinas')+'&body='+encodeURIComponent(corpo(id))}
      function desenhar(){
        var nsel=arr(SP).length,resp=ps.filter(function(id){return E[id]}).length;
        var h='<p class="lead">1. Escolha o que o professor vai ver. 2. Marque os professores. 3. Clique em <b>Preparar e-mails</b>. As respostas vão para a planilha <b>Escolha de disciplinas - professores</b>, no seu Drive. <b>'+resp+' de '+ps.length+'</b> já responderam.</p>'+
          ['m','c','a','o'].map(chips).join('')+
          '<div class="card"><b>'+contaDisc()+' disciplinas</b> <span class="muted">vão aparecer para os professores com esses filtros.</span></div>'+
          '<div class="card" style="overflow-x:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><b>Professores</b><span><button type="button" id="todos">Marcar todos</button> <button type="button" id="nenhum">Desmarcar</button></span></div><table><thead><tr><th></th><th>Professor</th><th>Situação</th></tr></thead><tbody>'+
          ps.map(function(id){var p=P[id],e=E[id];return '<tr><td style="width:36px"><input type="checkbox" class="sp" data-id="'+esc(id)+'"'+(SP[id]?' checked':'')+' style="width:18px;height:18px"'+(p.email?'':' title="Sem e-mail cadastrado"')+'></td><td><b>'+esc(p.nome)+'</b><br><span class="muted" style="font-size:12.5px">'+esc(p.email||'sem e-mail cadastrado')+'</span></td><td>'+(e?'<span class="pill s">Respondeu</span><br><span class="muted" style="font-size:12.5px">'+dataBR(e.enviadoEm)+' · '+((e.lista||[]).length)+' disc.</span>':'<span class="pill n">Aguardando</span>'+(EV[id]&&EV[id].em?'<br><span class="muted" style="font-size:12.5px">E-mail enviado em '+dataBR(EV[id].em).slice(0,10)+'</span>':''))+'</td></tr>'}).join('')+
          '</tbody></table><div class="foot"><button class="pri" id="preparar"'+(nsel?'':' disabled')+'>Preparar e-mails ('+nsel+')</button></div></div>';
        if(fila){h+='<div class="card" id="fila"><b>E-mails prontos</b> <span class="muted">Clique em cada professor: o Outlook abre com o e-mail pronto. É só conferir e enviar.</span><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+
          fila.map(function(id){var p=P[id];return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px"><span><b>'+esc(p.nome)+'</b> <span class="muted" style="font-size:12.5px">'+esc(p.email||'sem e-mail')+'</span></span><span style="white-space:nowrap"><a class="abrir" data-id="'+esc(id)+'" href="'+mailto(id)+'" style="font-weight:700">'+(EV[id]&&EV[id].em&&EV[id].em.slice(0,10)===new Date().toISOString().slice(0,10)?'Enviado ✓':'Abrir no Outlook')+'</a> · <a href="#" data-copy="'+esc(linkDe(id))+'">Copiar link</a></span></div>'}).join('')+'</div></div>'}
        app.innerHTML=h;
        if(fila){var fl=document.getElementById('fila');if(fl)fl.scrollIntoView({behavior:'smooth',block:'start'})}
      }
      app.addEventListener('click',function(e){
        var c=e.target.closest('.chip');if(c){var t=c.getAttribute('data-t'),v=c.getAttribute('data-v');if(F[t][v])delete F[t][v];else F[t][v]=1;fila=null;desenhar();return}
        if(e.target.id==='todos'){ps.forEach(function(id){SP[id]=1});fila=null;desenhar();return}
        if(e.target.id==='nenhum'){SP={};fila=null;desenhar();return}
        if(e.target.id==='preparar'){fila=ps.filter(function(id){return SP[id]});desenhar();return}
        var ab=e.target.closest('.abrir');if(ab){var aid=ab.getAttribute('data-id'),em=new Date().toISOString();EV[aid]={em:em};ab.textContent='Enviado ✓';GFI.api('set',{col:'escolhasEnvio',id:aid,data:{em:em}}).catch(function(){});return}
        var cp=e.target.closest('[data-copy]');if(cp){e.preventDefault();var t2=cp.getAttribute('data-copy');(navigator.clipboard?navigator.clipboard.writeText(t2):Promise.reject()).then(function(){cp.textContent='Copiado!'},function(){prompt('Copie o link:',t2)})}
      });
      app.addEventListener('change',function(e){var x=e.target.closest('.sp');if(!x)return;var id=x.getAttribute('data-id');if(x.checked)SP[id]=1;else delete SP[id];fila=null;desenhar()});
      desenhar();
    },function(err){app.innerHTML='<div class="card"><span class="msg bad">Não foi possível carregar.</span> <span class="muted">'+esc(err&&err.message)+'</span></div>'});
  }
})();
</script>
</body>
</html>
