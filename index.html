  const GEAR_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
  // fotos gratuitas (Unsplash License), uma por painel
  const U = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=800&q=70`;
  const FOTOS = {
    'gestao-docente.html': U('1768055105012-4c53791b2877'),
    'projetos.html': U('1676276376052-dc9c9c0b6917'),
    'validacao.html': U('1457369804613-52c61a468e7d'),
    'calendario.html': U('1435527173128-983b87201f4d'),
    'gestao-regulatoria.html': U('1583521214690-73421a1829a9'),
    'gestao-equipe.html': 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&w=800&q=70'
  };
  const arrow = svg('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>');

  function render(){
    const cats = [...new Set(state.panels.map(p => p.category).filter(Boolean))];
    $('#cat-list').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');

    const cards = state.panels.map((p, i) => {
      const { icon, tone } = look(p.category, p.name);
      const has = !!p.url;
      const foto = '';
      const inner = `<div class="card-top"><div class="ico">${icon}</div>${has && !editing ? `<span class="arrow">${arrow}</span>` : ''}</div>
        <div class="card-body">
          ${p.category ? `<div class="cat">${esc(p.category)}</div>` : ''}
          <h3>${esc(p.name)}</h3>
          ${p.desc ? `<p>${esc(p.desc)}</p>` : ''}
        </div>
        ${editing ? `<div class="edit-row">
            <button data-act="edit" data-id="${p.id}">Editar</button>
            <button data-act="up" data-id="${p.id}" ${i === 0 ? 'disabled' : ''} aria-label="Mover para antes">←</button>
            <button data-act="down" data-id="${p.id}" ${i === state.panels.length - 1 ? 'disabled' : ''} aria-label="Mover para depois">→</button>
            <button data-act="del" data-id="${p.id}" class="danger">Remover</button>
          </div>` : ''}`;
      return (has && !editing)
        ? `<a class="card" data-tone="${tone}" href="${esc(p.url)}" target="_blank" rel="noopener">${inner}</a>`
        : `<article class="card${has ? '' : ' nolink'}" data-tone="${tone}">${inner}</article>`;
    }).join('');
    $('#grid').innerHTML = cards + (editing ? `<button class="add-card" data-act="add"><span class="plus">+</span>Adicionar painel</button>` : '');

    const n = state.panels.length;
    $('#count').textContent = `${n} ${n === 1 ? 'painel' : 'painéis'}`;
    $('#updated').textContent = state.updated ? `Atualizado em ${fmtDate(state.updated)}` : '';

    let tools = '';
    if (!editing) tools = `<a class="drive-btn" href="${DRIVE_URL}" target="_blank" rel="noopener" aria-label="Abrir pasta do Google Drive" title="Abrir pasta do Google Drive">${DRIVE_ICO}</a>`;
    if (!editing && !readOnly && artifactNs) tools += `<button id="btn-edit" class="ico-btn" aria-label="Editar painéis" title="Editar painéis">${GEAR_ICO}</button>`;
    if (editing) tools = `<button id="btn-cancel">Descartar</button><button class="primary" id="btn-save" ${dirty && !saving ? '' : 'disabled'}>${saving ? 'Salvando…' : 'Salvar alterações'}</button>`;
    $('#tools').innerHTML = tools;
  }

  function banner(msg){
    const b = $('#banner');
    if (!msg){ b.hidden = true; b.innerHTML = ''; return; }
    b.className = 'banner'; b.innerHTML = `<p>${esc(msg)}</p>`; b.hidden = false;
  }

  function openEditor(p){
    editId = p ? p.id : null;
    $('#dlg-title').textContent = p ? 'Editar painel' : 'Novo painel';
    $('#f-name').value = p?.name || '';
    $('#f-cat').value = p?.category || '';
    $('#f-desc').value = p?.desc || '';
    $('#f-url').value = p?.url || '';
    $('#f-err').hidden = true;
    $('#dlg').showModal();
    $('#f-name').focus();
  }

  $('#editor').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#f-name').value.trim(), url = $('#f-url').value.trim();
    const err = m => { $('#f-err').textContent = m; $('#f-err').hidden = false; };
    if (!name) return err('Dê um nome ao painel.');
    if (url && /\s/.test(url)) return err('O link não pode ter espaços.');
    const data = { name, category: $('#f-cat').value.trim(), desc: $('#f-desc').value.trim(), url };
    if (editId) Object.assign(state.panels.find(p => p.id === editId), data);
    else state.panels.push({ id: 'p' + Date.now().toString(36), ...data });
    dirty = true; $('#dlg').close(); render();
  });
  $('#f-cancel').addEventListener('click', () => $('#dlg').close());

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'btn-edit'){ editing = true; render(); return; }
    if (t.id === 'btn-cancel'){ state = JSON.parse(JSON.stringify(saved)); editing = false; dirty = false; banner(); render(); return; }
    if (t.id === 'btn-save'){ save(); return; }
    const act = t.dataset.act, id = t.dataset.id;
    if (!act) return;
    const i = state.panels.findIndex(p => p.id === id);
    if (act === 'add') openEditor(null);
    if (act === 'edit') openEditor(state.panels[i]);
    if (act === 'up' && i > 0){ [state.panels[i-1], state.panels[i]] = [state.panels[i], state.panels[i-1]]; dirty = true; render(); }
    if (act === 'down' && i < state.panels.length - 1){ [state.panels[i+1], state.panels[i]] = [state.panels[i], state.panels[i+1]]; dirty = true; render(); }
    if (act === 'del'){
      if (t.dataset.confirm){ state.panels.splice(i, 1); dirty = true; render(); }
      else { t.dataset.confirm = '1'; t.textContent = 'Confirmar remoção'; }
    }
  });

  function buildDocument(){
    const today = new Date(); const pad = n => String(n).padStart(2,'0');
    const next = { ...state, updated: `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}` };
    const json = JSON.stringify(next).replace(/</g, '\\u003c');
    const reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
    const head = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>';
    const fonts = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    return head
      + '<title>Gestão Fabio Iba</title>\n'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
      + (fonts ? `<link rel="stylesheet" href="${fonts.getAttribute('href')}">\n` : '')
      + '<style id="hub-style">' + $('#hub-style').textContent + '</style>\n'
      + PRISTINE + '\n'
      + '<script type="application/json" id="hub-data">' + json + '<\/script>\n'
      + '<script id="hub-script">' + $('#hub-script').textContent + '<\/script>\n'
      + '</body></html>';
  }

  async function save(){
    if (!artifactNs || saving) return;
    saving = true; render();
    try {
      await artifactNs.publish(buildDocument());
      banner('Salvo. A página vai recarregar com a nova versão.');
    } catch (e){
      saving = false;
      const code = e && e.code;
      if (code === 'conflict') banner('Outra versão foi salva antes. A página vai recarregar com ela; refaça a alteração se precisar.');
      else if (['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'].includes(code)){
        readOnly = true; editing = false; state = JSON.parse(JSON.stringify(saved)); dirty = false;
        banner('Você está vendo esta página em modo leitura. Só quem tem permissão de edição pode alterar os painéis.');
      }
      else if (code === 'rate_limited') banner('Muitas gravações seguidas. Aguarde um minuto e salve de novo.');
      else banner('Não foi possível salvar agora. Suas alterações continuam na tela; tente salvar novamente.');
      render();
    }
  }

  try { $('#today').textContent = (d => d.toLocaleDateString('pt-BR', { weekday:'long' }) + ', ' + d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' }))(new Date()); } catch {}
  try { const hh = new Date().getHours(); $('#saud').textContent = (hh < 12 ? 'Bom dia' : hh < 18 ? 'Boa tarde' : 'Boa noite') + ', Fábio'; } catch {}
  render();
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(ns => { artifactNs = ns; render(); }).catch(() => {});
  }
})();

(function(){
  var $=function(s){return document.querySelector(s)};
  function nav(){var cards=[].slice.call(document.querySelectorAll('#grid .card'));
    $('#nav').innerHTML=cards.map(function(c){var ico=c.querySelector('.ico'),h=c.querySelector('h3'),href=c.getAttribute('href');return '<a '+(href?'href="'+href+'"'+(c.target?' target="_blank" rel="noopener"':''):'')+'>'+(ico?ico.innerHTML:'')+'<span>'+(h?h.textContent:'')+'</span></a>'}).join('');
    
    var d=document.querySelector('#tools a[href*="drive.google"]');if(d){$('#side-drive').href=d.href;$('#side-drive').innerHTML=d.innerHTML+' Pasta no Drive'}
    filtrar()}
  function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
  function filtrar(){var q=norm($('#busca').value);[].forEach.call(document.querySelectorAll('#grid .card'),function(c){c.style.display=!q||norm(c.textContent).indexOf(q)>=0?'':'none'})}
  $('#busca').addEventListener('input',filtrar);
  
  new MutationObserver(nav).observe($('#grid'),{childList:true});nav();
})();
</script>
<style id="novas-style">
.tem-novas .band .drive-btn{position:relative}
.tem-novas .band .drive-btn::after{content:"";position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#E5322D;border:2px solid #fff;box-shadow:0 0 0 2px rgba(229,50,45,.25)}
</style>
<script id="novas-script">
/* bolinha vermelha no botão do Drive quando chegam novas respostas da Escolha de disciplinas;
   some quando você clica no botão (o "visto" fica guardado na planilha, vale em qualquer computador) */
(function(){
  if(!window.GFI)return;
  var vistoEm='',ultima='';
  function marcar(){document.documentElement.classList.toggle('tem-novas',!!ultima&&ultima>vistoEm);
    var b=document.querySelector('.drive-btn');if(b)b.title=document.documentElement.classList.contains('tem-novas')?'Novas respostas na Escolha de disciplinas':'Abrir pasta do Google Drive'}
  function checar(){
    Promise.all([GFI.api('listMany',{app:'gd',cols:['escolhas']}),GFI.api('listMany',{cols:['avisos']})]).then(function(r){
      ultima='';(r[0].escolhas||[]).forEach(function(d){var e=d.data&&d.data.enviadoEm||'';if(e>ultima)ultima=e});
      var v=(r[1].avisos||[]).filter(function(d){return d.id==='escolhas'})[0];vistoEm=(v&&v.data&&v.data.vistoEm)||'';
      marcar()}).catch(function(){});
  }
  document.addEventListener('click',function(e){
    if(!e.target.closest('.drive-btn')||!document.documentElement.classList.contains('tem-novas'))return;
    vistoEm=new Date().toISOString();marcar();
    GFI.db.doc('avisos/escolhas').set({vistoEm:vistoEm}).catch(function(){});
  },true);
  new MutationObserver(function(){marcar()}).observe(document.getElementById('tools'),{childList:true});
  checar();setInterval(function(){if(!document.hidden)checar()},60000);
})();
</script>

<script id="resumo-script">
(function(){
  if(!window.GFI||!GFI.temChave||!GFI.temChave())return;
  function pad(n){return (n<10?'0':'')+n}var d=new Date(),hj=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),agora=pad(d.getHours())+':'+pad(d.getMinutes());
  function br(s){var p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]:'—'}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function m(l){var o={};(l||[]).forEach(function(x){o[x.id]=Object.assign({id:x.id},x.data||{})});return o}
  GFI.api('listMany',{app:'proj',cols:['projetos','edicoes','chat','eventos']}).then(function(r){
    var P=m(r.projetos),C=m(r.chat),V=m(r.eventos),ev=Object.keys(V).map(function(k){return V[k]}).filter(function(e){return P[e.projetoId]});
    var prox=ev.filter(function(e){return e.status!=='concluida'&&(e.data>hj||(e.data===hj&&(e.hora||'')>=agora))}).sort(function(a,b){return (a.data+(a.hora||'')).localeCompare(b.data+(b.hora||''))})[0];
    var pend=ev.filter(function(e){return e.tipo==='reuniao'&&e.status!=='concluida'&&(e.data<hj||(e.data===hj&&e.fim&&e.fim<agora))});
    var novas={};Object.keys(C).forEach(function(k){var x=C[k],l='';try{l=localStorage.getItem('gfi_chat_lido_'+x.projetoId)||''}catch(e){}if(P[x.projetoId]&&x.autorId!=='sponsor'&&String(x.em||'')>l)novas[x.projetoId]=(novas[x.projetoId]||0)+1});
    var nTot=Object.keys(novas).reduce(function(s,k){return s+novas[k]},0),nP=Object.keys(novas)[0];
    var lk=function(pid){return 'projeto.html?p='+encodeURIComponent(pid)};
    var h='<a class="kpi k1" href="'+(prox?lk(prox.projetoId):'projetos.html')+'"><small>Próxima reunião</small><b>'+(prox?br(prox.data)+(prox.hora?' · '+esc(prox.hora):''):'Nenhuma')+'</b><span>'+(prox?esc(prox.titulo||'Reunião')+' — '+esc(P[prox.projetoId].nome):'nada agendado nos projetos')+'</span></a>'
     +'<a class="kpi k2" href="'+(nP?lk(nP):'projetos.html')+'"><small>Mensagens novas</small><b>'+(nTot||'Nenhuma')+'</b><span>'+(nTot?Object.keys(novas).map(function(k){return esc(P[k].nome)+' ('+novas[k]+')'}).join(' · '):'chats dos projetos em dia')+'</span></a>'
     +'<a class="kpi k3" href="'+(pend[0]?lk(pend[0].projetoId):'projetos.html')+'"><small>Decisões a registrar</small><b>'+(pend.length||'Nenhuma')+'</b><span>'+(pend.length?'reunião(ões) realizada(s) sem as decisões registradas':'todas as reuniões com decisões')+'</span></a>';
    var s=document.getElementById('resumo');s.innerHTML=h;s.hidden=false;
  }).catch(function(){});
})();
</script>
