<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horário de trabalho · Mediadores</title>
<script>window.GFI_APP='gd';window.GFI_LS=[]</script>
<script src="config.js?v=6"></script>
<script src="gfi.js?v=12"></script>
<style>
:root{--bg:#EEF2F5;--card:#fff;--ink:#0F1B2A;--mut:#5B6878;--line:#DCE4EA;--ac:#0F6E7A;--ac-s:#DDF1F1;--bad:#B92F26;--ok:#146C45;--warn:#8A6A12;--warn-s:#FBF1D9}
@media (prefers-color-scheme:dark){:root{--bg:#0B131B;--card:#131F2A;--ink:#E8EEF3;--mut:#93A3B2;--line:#23313E;--ac:#4CC7C2;--ac-s:#12302F;--bad:#FF8F86;--ok:#5FD09B;--warn:#EAB35A;--warn-s:#35280F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.band{border-radius:18px;padding:22px 26px;color:#F3F7FA;background:radial-gradient(500px 240px at 90% 0%,rgba(76,199,194,.35),transparent 60%),linear-gradient(120deg,#0B1D2E,#10294A 60%,#134B5A);box-shadow:0 12px 30px -14px rgba(15,27,42,.4)}
.band h1{margin:0;font-size:clamp(22px,4vw,32px)}
.band p{margin:6px 0 0;color:#B9CAD6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 4px}.card p.mut{margin:0 0 12px;color:var(--mut);font-size:13.5px}
label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13px}
input,select{font:inherit;font-weight:400;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px;table-layout:fixed}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--mut)}
td input{width:100%}
tr.noite td{background:var(--warn-s)}
.tot{font-weight:700;white-space:nowrap}
.outro{display:grid;grid-template-columns:3fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px}
.dias{display:flex;gap:4px;flex-wrap:wrap}.dias label{flex-direction:row;align-items:center;gap:3px;font-weight:400;font-size:12.5px}
button{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.x{padding:6px 12px;color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-weight:700}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.resumo{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:14px}.resumo b{font-size:18px;display:block}
@media (max-width:640px){.outro{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="band"><h1>Horário de trabalho</h1><p id="quem">Carregando…</p></div>
  <div id="app"></div>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var DIAS=[['seg','Segunda'],['ter','Terça'],['qua','Quarta'],['qui','Quinta'],['sex','Sexta']],TODOS=[['seg','Seg'],['ter','Ter'],['qua','Qua'],['qui','Qui'],['sex','Sex'],['sab','Sáb'],['dom','Dom']];
function min(h){if(!h)return null;var p=h.split(':');return (+p[0])*60+(+p[1])}
function dur(a,b){var x=min(a),y=min(b);return x==null||y==null||y<=x?0:y-x}
function hm(m){return Math.floor(m/60)+'h'+(m%60?(m%60<10?'0':'')+(m%60):'')}
var cod=(/[#?&]p=([\w-]+\.[a-z0-9]+)/i.exec(location.hash+'&'+location.search)||[])[1]||'';
if(cod){try{localStorage.setItem('gdPortal',cod)}catch(e){}}
var PORTAL=cod||(function(){try{return localStorage.getItem('gdPortal')||''}catch(e){return ''}})();
var pid=(cod||(function(){try{return localStorage.getItem('gdPortal')||''}catch(e){return ''}})()).split('.')[0];
var ANO='2027',H={ano:ANO,carga:'',dias:{},outros:[],obs:''},PAPEL='mediador',PROF=false;
var MODS={'EAD 40':{h:16,tipo:'ead'},'EAD 20':{h:8,tipo:'ead'},'Regente 40':{h:40,tipo:'reg'},'Regente 20':{h:20,tipo:'reg'},'Regente 12':{h:12,tipo:'reg'}};
function noiteMin(d){return intervalos(d).reduce(function(s,iv){var a=Math.max(min(iv[0]),18*60),b=Math.min(min(iv[1]),24*60);return s+(b>a?b-a:0)},0)}
function foraComercial(d){return intervalos(d).reduce(function(s,iv){var a=min(iv[0]),b=min(iv[1]),x=0;if(a<8*60)x+=Math.min(b,8*60)-a;return s+x},0)}
// regras do contrato do professor: devolve a lista de pendências
function regras(){if(!PROF)return [];var m=MODS[H.modalidade],out=[],NM={seg:'segunda',ter:'terça',qua:'quarta',qui:'quinta',sex:'sexta'};if(!m)return out;
  var tot=DIAS.reduce(function(s,d){return s+horasDia(d[0])},0);
  if(tot>m.h*60)out.push('O total informado ('+hm(tot)+') ultrapassa as '+m.h+' horas semanais do contrato. Desmarque '+hm(tot-m.h*60)+' de períodos.');
  if(tot<m.h*60)out.push('O total informado ('+hm(tot)+') é menor que as '+m.h+' horas semanais exigidas para '+({'EAD 40':'Formador 40 (EAD 40)','EAD 20':'Formador 20 (EAD 20)'}[H.modalidade]||H.modalidade)+'.');
  noitesObr().forEach(function(d){if(noiteMin(d)<240)out.push('A noite de '+NM[d]+' é obrigatória para '+(H.modalidade||'o seu contrato')+'.')});
  return out}
function mostrarRegras(){var r=regras(),b=$('#regra');if(!b)return r;b.hidden=!r.length;b.innerHTML=r.length?'<b>⚠ Disponibilidade diferente da carga do contrato</b><ul style="margin:6px 0 0;padding-left:18px">'+r.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><div style="margin-top:6px">O envio fica bloqueado até ajustar.</div>':'';return r}
var NOITES={'EAD 40':['qua'],'EAD 20':['qua'],'Regente 40':['seg','ter','qua','qui'],'Regente 20':['seg','ter','qua','qui'],'Regente 12':['seg','ter','qua']};
function noitesObr(){return PROF?(NOITES[H.modalidade]||['qua']):['qua']}
function noturnoDia(d){return noitesObr().indexOf(d)>=0}
function aplicarNoites(){if(!PROF)return;DIAS.forEach(function(d){var v=H.dias[d[0]]=H.dias[d[0]]||{};v.periodos=v.periodos||{};if(noturnoDia(d[0]))v.periodos.noite=true;if(d[0]==='sex')v.periodos.noite=false})}
var PER=[['manha','Manhã','08:00','12:00'],['tarde','Tarde','13:30','17:30'],['noite','Noite','19:00','23:00']];
function horasDia(d){var v=H.dias[d]||{};if(PROF)return PER.filter(function(p){return (v.periodos||{})[p[0]]}).length*240;var t=dur(v.entrada,v.almoco)+dur(v.retorno,v.saida);if(!v.almoco&&!v.retorno)t=dur(v.entrada,v.saida);return t}
function render(){
  var tot=DIAS.reduce(function(s,d){return s+horasDia(d[0])},0),q=H.dias.qua||{},noite=dur(q.noiteInicio,q.noiteFim);
  var opcs=['EAD 40','EAD 20','Regente 40','Regente 20','Regente 12'],ROT={'EAD 40':'Formador 40 (EAD 40)','EAD 20':'Formador 20 (EAD 20)'},mm=MODS[H.modalidade];
  var h=(PROF?'<div class="card"><h2>Seu contrato</h2><p class="mut">'+(!mm?'Escolha a modalidade do seu contrato.':mm.tipo==='reg'?'Regente 40 e Regente 20: noites de segunda a quinta obrigatórias · Regente 12: noites de segunda, terça e quarta obrigatórias. O restante da carga você distribui.':'Formador 40 (EAD 40): 16 horas por semana · Formador 20 (EAD 20): 8 horas por semana. Em ambos, a quarta-feira à noite é obrigatória. O restante da carga você distribui.')+'</p><label style="max-width:260px">Modalidade<select id="modal"><option value="">Selecione</option>'+opcs.map(function(x){return '<option value="'+x+'"'+(H.modalidade===x?' selected':'')+'>'+(ROT[x]||x)+'</option>'}).join('')+'</select></label>'+(mm?'<p style="margin:10px 0 0"><b>'+mm.h+' horas semanais</b> disponíveis para a IES (nem mais, nem menos).</p>':'')+'</div>'
   :'<div class="card"><h2>Carga horária na Unicesumar</h2><p class="mut">Informe a carga semanal do seu contrato.</p><div style="display:flex;gap:14px;flex-wrap:wrap"><label style="max-width:260px">Horas por semana<select id="carga"><option value="">Selecione</option>'+['20','40'].map(function(x){return '<option value="'+x+'"'+(String(H.carga)===x?' selected':'')+'>'+x+' horas</option>'}).join('')+'</select></label></div></div>')
   +'<div class="card"><h2>'+(PROF?'Disponibilidade de segunda a sexta':'Jornada de segunda a sexta')+'</h2><p class="mut">'+(PROF?'Marque os períodos em que está disponível para a IES. Cada período (manhã, tarde ou noite) corresponde a 4 horas. <b>As noites obrigatórias do seu contrato já vêm marcadas; a sexta à noite é indisponível.</b>':'Entrada, saída para o almoço, retorno e fim do expediente. <b>Na quarta-feira, o horário deve incluir as 4 horas obrigatórias à noite.</b>')+'</p>'+(PROF?'<div class="tw"><table><colgroup><col style="width:22%"><col><col><col><col style="width:12%"></colgroup><thead><tr><th>Dia</th><th>Manhã <small style="font-weight:400">(4h)</small></th><th>Tarde <small style="font-weight:400">(4h)</small></th><th>Noite <small style="font-weight:400">(4h)</small></th><th></th><th>Total</th></tr></thead><tbody>'+DIAS.map(function(d){var v=H.dias[d[0]]||{};return '<tr'+(noturnoDia(d[0])?' class="noite"':'')+'><td><b>'+d[1]+'</b>'+(noturnoDia(d[0])?'<br><small style="color:var(--warn);font-weight:700">noite obrigatória</small>':'')+'</td>'+PER.map(function(p){return '<td><label style="flex-direction:row;align-items:center;gap:8px;font-weight:400;cursor:pointer"><input type="checkbox" data-per="'+p[0]+'" data-pd="'+d[0]+'"'+((v.periodos||{})[p[0]]?' checked':'')+((noturnoDia(d[0])||d[0]==='sex')&&p[0]==='noite'?' disabled':'')+' style="width:20px;height:20px">'+(p[0]==='noite'&&noturnoDia(d[0])?'<b>obrigatório</b>':p[0]==='noite'&&d[0]==='sex'?'<span style="color:var(--mut)">indisponível</span>':'disponível')+'</label></td>'}).join('')+'<td></td><td class="tot" id="t-'+d[0]+'">'+hm(horasDia(d[0]))+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="tw"><table><colgroup><col style="width:16%"><col><col><col><col><col style="width:12%"></colgroup><thead><tr><th>Dia</th><th>Entrada</th><th>Almoço</th><th>Retorno</th><th>Saída</th><th>Total</th></tr></thead><tbody>'
   +DIAS.map(function(d){var v=H.dias[d[0]]||{},f=function(k){return '<input type="time" data-d="'+d[0]+'" data-k="'+k+'" value="'+esc(v[k]||'')+'">'};
     return '<tr'+(noturnoDia(d[0])?' class="noite"':'')+'><td><b>'+d[1]+'</b>'+(noturnoDia(d[0])?'<br><small style="color:var(--warn);font-weight:700">inclui 4h à noite</small>':'')+'</td><td>'+f('entrada')+'</td><td>'+f('almoco')+'</td><td>'+f('retorno')+'</td><td>'+f('saida')+'</td><td class="tot" id="t-'+d[0]+'">'+hm(horasDia(d[0]))+'</td></tr>'
      }).join('')
   +'</tbody></table></div>')+'<div class="resumo"><div><b id="tot">'+hm(tot)+'</b>total na semana</div><div><b id="crg">'+(PROF?(mm?mm.h+'h':'—'):(H.carga?H.carga+'h':'—'))+'</b>'+(PROF?'exigidas':'contratadas')+'</div></div></div>'
   +(PROF?'':'<div class="card"><h2>Outros locais de trabalho</h2><p class="mut">Se você trabalha em outro lugar, informe o local e o horário.</p><div id="outros">'
   +(H.outros.length?H.outros.map(function(o,i){return '<div class="outro"><label>Local<input data-o="'+i+'" data-k="local" value="'+esc(o.local)+'" placeholder="Empresa / instituição"></label><label>Início<input type="time" data-o="'+i+'" data-k="inicio" value="'+esc(o.inicio)+'"></label><label>Fim<input type="time" data-o="'+i+'" data-k="fim" value="'+esc(o.fim)+'"></label><button type="button" class="x" data-del="'+i+'">Remover</button></div>'}).join(''):'<p class="mut" style="margin:0 0 10px">Nenhum outro local informado.</p>')
   +'</div><button type="button" id="add">+ Adicionar local</button></div>')
   +'<div id="regra" hidden style="margin-top:16px;border:2px solid var(--bad);background:#FFF1F0;color:var(--bad);border-radius:14px;padding:14px 16px"></div><div id="conf" hidden style="margin-top:16px;border:2px solid var(--bad);background:#FFF1F0;color:var(--bad);border-radius:14px;padding:14px 16px"></div><div class="card"><label>Observações<input id="obs" value="'+esc(H.obs)+'" placeholder="Opcional"></label><div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="pri" type="button" id="salvar">Enviar meu horário</button></div><p class="msg" id="msg"></p></div>';
  setTimeout(function(){mostrarConflitos();mostrarRegras()},0);
  $('#app').innerHTML=h;
}
function fechado(){var tot=DIAS.reduce(function(s,d){return s+horasDia(d[0])},0),q=H.dias.qua||{};
  $('#app').innerHTML='<div class="card" style="border-color:var(--ok)"><h2 style="color:var(--ok)">✓ Horário de '+esc(H.ano)+' enviado</h2><p class="mut">Enviado em '+esc(String(H.atualizadoEm||'').slice(0,10).split('-').reverse().join('/'))+'. A coordenação já recebeu. Para alterar, fale com a coordenação.</p>'
   +(PROF?'<div class="tw"><table><thead><tr><th>Dia</th><th>Manhã</th><th>Tarde</th><th>Noite</th></tr></thead><tbody>'+DIAS.map(function(d){var v=H.dias[d[0]]||{},pp=v.periodos||{};return '<tr'+(noturnoDia(d[0])?' class="noite"':'')+'><td><b>'+d[1]+'</b></td>'+PER.map(function(p){return '<td>'+(pp[p[0]]?'✓':'—')+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>':'')+(PROF?'':'<div class="tw"><table><thead><tr><th>Dia</th><th>Entrada</th><th>Almoço</th><th>Retorno</th><th>Saída</th></tr></thead><tbody>'+DIAS.map(function(d){var v=H.dias[d[0]]||{};return '<tr'+(noturnoDia(d[0])?' class="noite"':'')+'><td><b>'+d[1]+'</b></td><td>'+esc(v.entrada||'—')+'</td><td>'+esc(v.almoco||'—')+'</td><td>'+esc(v.retorno||'—')+'</td><td>'+esc(v.saida||'—')+'</td></tr>'}).join('')+'</tbody></table></div>')
   +'<div class="resumo"><div><b>'+hm(tot)+'</b>total na semana</div><div><b>'+esc(H.carga||'—')+'h</b>'+(PROF?'exigidas · '+esc(H.modalidade||''):'contratadas')+'</div></div>'
   +((H.outros||[]).length?'<p style="margin:14px 0 4px"><b>Outros locais</b></p>'+H.outros.map(function(o){return '<div>'+esc(o.local)+' · '+esc(o.inicio)+'–'+esc(o.fim)+'</div>'}).join(''):'')+'</div>'}
function intervalos(d){var v=H.dias[d]||{},r=[];if(PROF){PER.forEach(function(p){if((v.periodos||{})[p[0]])r.push([p[2],p[3]])});return r}if(v.almoco||v.retorno){if(v.entrada&&v.almoco)r.push([v.entrada,v.almoco]);if(v.retorno&&v.saida)r.push([v.retorno,v.saida])}else if(v.entrada&&v.saida)r.push([v.entrada,v.saida]);return r}
function conflitos(){var out=[],NOME={seg:'segunda',ter:'terça',qua:'quarta',qui:'quinta',sex:'sexta'};
  (H.outros||[]).forEach(function(o){if(!o.inicio||!o.fim)return;['seg','ter','qua','qui','sex'].forEach(function(d){if(!NOME[d])return;
    intervalos(d).forEach(function(iv){var a=min(iv[0]),b=min(iv[1]),c=min(o.inicio),e=min(o.fim);if(a<e&&c<b)out.push('Na '+NOME[d]+', o horário na Unicesumar ('+iv[0]+'–'+iv[1]+') coincide com '+(o.local||'outro local')+' ('+o.inicio+'–'+o.fim+').')})})});
  return out}
function mostrarConflitos(){var c=conflitos(),b=$('#conf');if(!b)return c;b.hidden=!c.length;b.innerHTML=c.length?'<b>⚠ Conflito de horário</b><ul style="margin:6px 0 0;padding-left:18px">'+c.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><div style="margin-top:6px">Ajuste os horários: não é possível estar em dois locais ao mesmo tempo. O envio fica bloqueado até corrigir.</div>':'';return c}
function atualizarTotais(){mostrarConflitos();mostrarRegras();DIAS.forEach(function(d){var e=$('#t-'+d[0]);if(e)e.textContent=hm(horasDia(d[0]))});var q=H.dias.qua||{};$('#tot').textContent=hm(DIAS.reduce(function(s,d){return s+horasDia(d[0])},0));if(!PROF)$('#crg').textContent=H.carga?H.carga+'h':'—'}
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='obs'){H.obs=t.value;return}
  if(t.dataset.d){(H.dias[t.dataset.d]=H.dias[t.dataset.d]||{})[t.dataset.k]=t.value;atualizarTotais();return}
  if(t.dataset.o!=null&&t.dataset.k){H.outros[+t.dataset.o][t.dataset.k]=t.value;mostrarConflitos()}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.per){var dd=H.dias[t.dataset.pd]=H.dias[t.dataset.pd]||{};dd.periodos=dd.periodos||{};dd.periodos[t.dataset.per]=t.checked;atualizarTotais();return}if(t.id==='modal'){var ant=noitesObr();H.modalidade=t.value;H.carga=MODS[t.value]?String(MODS[t.value].h):'';ant.forEach(function(d){if(!noturnoDia(d)&&H.dias[d]&&H.dias[d].periodos)H.dias[d].periodos.noite=false});aplicarNoites();render();return}if(t.id==='carga'){H.carga=t.value;atualizarTotais();return}if(t.dataset.dia){var o=H.outros[+t.dataset.o];o.dias=o.dias||[];var i=o.dias.indexOf(t.dataset.dia);if(t.checked&&i<0)o.dias.push(t.dataset.dia);if(!t.checked&&i>=0)o.dias.splice(i,1);mostrarConflitos()}});
document.addEventListener('click',function(e){var t=e.target;
  if(t.id==='add'){H.outros.push({local:'',dias:['seg','ter','qua','qui','sex'],inicio:'',fim:''});render();return}
  if(t.dataset.del!=null){H.outros.splice(+t.dataset.del,1);render();return}
  if(t.id==='salvar'){var m=$('#msg'),q=H.dias.qua||{};
    var falta=PROF&&!H.modalidade?'Escolha a modalidade do seu contrato.':!H.carga?'Informe a carga horária semanal.':DIAS.some(function(d){var v=H.dias[d[0]]||{};return PROF?false:(!v.entrada||!v.saida)})?(PROF?'Em cada dia preenchido, informe a entrada e a saída.':'Informe a entrada e a saída de todos os dias.'):H.outros.some(function(o){return !o.local||!o.inicio||!o.fim})?'Complete local e horário de cada outro local de trabalho (ou remova).':'';
    if(!falta&&PROF&&!DIAS.some(function(d){return horasDia(d[0])>0}))falta='Marque pelo menos um período disponível.';
    if(!falta&&mostrarRegras().length)falta='A disponibilidade não atende às regras do seu contrato. Veja o quadro vermelho.';
    if(!falta&&mostrarConflitos().length)falta='Há conflito de horário com outro local de trabalho. Corrija antes de enviar.';
    if(falta){m.className='msg bad';m.textContent=falta;var cf=$('#conf');if(cf&&!cf.hidden)cf.scrollIntoView({behavior:'smooth',block:'center'});return}
    if(!window.confirm('Depois de enviar, o horário de '+H.ano+' não poderá mais ser alterado por aqui. Enviar agora?'))return;t.disabled=true;t.textContent='Enviando…';
    GFI.api('horario',{data:H,key:'',portal:PORTAL}).then(function(){H.enviado=true;H.atualizadoEm=new Date().toISOString();fechado()})
     .catch(function(x){t.disabled=false;t.textContent='Enviar meu horário';m.className='msg bad';m.textContent='Não foi possível salvar: '+((x&&x.message)||'erro')})}});
if(!pid){$('#quem').textContent='Abra esta página pelo link enviado pela coordenação.';return}
GFI.api('listMany',{app:'gd',cols:['pessoas','horarios'],key:'',portal:PORTAL}).then(function(r){
  var p=((r.pessoas||[]).filter(function(x){return x.id===pid})[0]||{}).data||{},hs=(r.horarios||[]).filter(function(x){return x.id===pid+'-'+ANO}).map(function(x){return x.data||{}}),h=hs[0];
  PAPEL=p.papel||'mediador';PROF=PAPEL==='formador'||PAPEL==='regente';
  $('#quem').textContent=(p.nome?p.nome+' · ':'')+(PROF?'disponibilidade de horário de ':'jornada de ')+ANO;
  if(PROF){document.title='Disponibilidade de horário · Professores';var b1=document.querySelector('.band h1');if(b1)b1.textContent='Disponibilidade de horário';

  if(h)H={ano:ANO,modalidade:h.modalidade||H.modalidade||'',carga:h.carga||H.carga||'',dias:h.dias||{},outros:h.outros||[],obs:h.obs||'',enviado:h.enviado,atualizadoEm:h.atualizadoEm};
