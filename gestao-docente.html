function dataIso(v){
  var n=Number(v);
  if(isFinite(n)&&n>20000&&n<80000)return new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000).toISOString().slice(0,10);
  var t=String(v||'').trim(),m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);
  if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);
  return '';
}
function atividadesDoRotulo(rot){
  var k=normK(rot);
  if(/^ae1/.test(k))return [];
  if(/^ae2/.test(k))return ['AE2'];
  if(/^ae3/.test(k))return ['AE3'];
  if(/^mapa/.test(k))return ['MAPA'];
  if(k.indexOf('explicativ')>=0)return /ae1/.test(k)?[]:['Vídeos explicativos'];
  var sl=k.indexOf('slide')>=0,ec=k.indexOf('estudodecaso')>=0;
  if(sl&&ec)return ['Slides','Estudo de caso'];
  if(sl)return ['Slides'];
  if(ec)return ['Estudo de caso'];
  return [];
}
function colIdx(l){var n=0;for(var i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return n}
function colLetra(n){var t='';while(n>0){var r=(n-1)%26;t=String.fromCharCode(65+r)+t;n=Math.floor((n-1)/26)}return t}
// Layout atual: um grupo de duas colunas por módulo (título "MÓDULO 51" na linha de cima; coluna de atividades + coluna de datas).
// Cada grupo tem blocos "disciplina 01", "disciplina 02". Layout antigo (sem título de módulo): colunas A e B valem para qualquer módulo.
function parseParteDatas(rows){
  var res={mods:{},legado:{}},grupos=[];
  rows.some(function(r){
    var ks=Object.keys(r.cols).filter(function(k){return /^modulo\d+$/.test(normK(r.cols[k]))}).sort(function(a,b){return colIdx(a)-colIdx(b)});
    if(!ks.length)return false;
    var prev=0;
    ks.forEach(function(k){
      var n=parseInt(String(r.cols[k]).replace(/\D/g,''),10);
      if(n<=prev)n=prev+1;   // título repetido na planilha: segue a sequência dos módulos
      prev=n;
      grupos.push({col:k,dcol:colLetra(colIdx(k)+1),mod:'Módulo '+n,ord:null});
    });
    return true;
  });
  // se o título de um módulo estiver faltando, vale a posição combinada: B=51, E=52, H=53, K=54 (atividades na coluna à esquerda)
  if(grupos.length){
    [['Módulo 51','A'],['Módulo 52','D'],['Módulo 53','G'],['Módulo 54','J']].forEach(function(f){
      var jaTem=grupos.some(function(g){return g.col===f[1]});
      var temBloco=rows.some(function(r){return /^disciplina\s*0*\d+/i.test(r.cols[f[1]]||'')});
      if(!jaTem&&temBloco&&!grupos.some(function(g){return g.mod===f[0]}))grupos.push({col:f[1],dcol:colLetra(colIdx(f[1])+1),mod:f[0],ord:null});
    });
  }
  if(!grupos.length){
    var atual=null;
    rows.forEach(function(r){
      var a=r.cols.A||'',m=/^disciplina\s*0*(\d+)/i.exec(a);
      if(m){atual=parseInt(m[1],10);res.legado[atual]=res.legado[atual]||{};return}
      if(atual===null||!a||normK(a)==='atividade')return;
      var iso=dataIso(r.cols.B),ats=atividadesDoRotulo(a);
      if(!iso){if(ats.indexOf('Vídeos explicativos')>=0)res.legado[atual]['Vídeos explicativos']='';return}
      ats.forEach(function(at){res.legado[atual][at]=iso});
    });
    return res;
  }
  rows.forEach(function(r){
    grupos.forEach(function(g){
      var a=r.cols[g.col]||'',m=/^disciplina\s*0*(\d+)/i.exec(a);
      if(m){g.ord=parseInt(m[1],10);res.mods[g.mod]=res.mods[g.mod]||{};res.mods[g.mod][g.ord]=res.mods[g.mod][g.ord]||{};return}
      if(g.ord===null||!a||normK(a)==='atividade'||/^modulo\d+$/.test(normK(a)))return;
      var iso=dataIso(r.cols[g.dcol]),ats=atividadesDoRotulo(a);
      if(!iso){if(ats.indexOf('Vídeos explicativos')>=0)res.mods[g.mod][g.ord]['Vídeos explicativos']='';return}
      ats.forEach(function(at){res.mods[g.mod][g.ord][at]=iso});
    });
  });
  return res;
}
// A aba tem duas seções: a de cima (datas usadas na Nova alocação) e a que começa no título "DATAS DE ENTREGA DOS PROFESSORES"
// (coluna "Entrega do professor", usada no formulário Entrega).
function parseDatasEntrega(rows){
  var it=-1;
  rows.some(function(r,i){if(/entrega.*professor/.test(normK(r.cols.A||''))&&!/^modulo/.test(normK(r.cols.A||''))){it=i;return true}return false});
  var res=parseParteDatas(it>=0?rows.slice(0,it):rows);
  res.professor=it>=0?parseParteDatas(rows.slice(it+1)):null;
  return res;
}
// Aba "Entregas": um bloco por módulo (título "MÓDULO nn/aaaa"), com 1ª e 2ª disciplina.
//  B = item, E/F = 1ª disciplina (Data limite = Prazo, Data entrega = Entregue em), G/H = 2ª disciplina, J = "Aula 01..04", K/L = datas das aulas.
//  Células mescladas: a data vale para todas as linhas mescladas (AE2+AE3, vídeos). Slides, vídeos e Estudo de caso têm só o Prazo.
function parseEntregasAba(rows){
  var porLinha={};rows.forEach(function(r){porLinha[r.linha]=r.cols});
  var mrg=rows.merges||[];
  function val(l,col){
    var ci=colIdx(col),c=null;
    for(var i=0;i<mrg.length;i++){var m=mrg[i];if(l>=m.r1&&l<=m.r2&&ci>=m.c1&&ci<=m.c2){c=m;break}}
    if(!c)return (porLinha[l]||{})[col]||'';
    if(ci!==c.c1)return '';   // parte horizontal de um mesclado (ex.: E:F): o valor é só da primeira coluna
    return (porLinha[c.r1]||{})[colLetra(c.c1)]||'';
  }
  function temColuna(l,col){   // false quando a célula é a metade direita de uma mescla (ex.: E:F): não há coluna própria de "Data entrega"
    var ci=colIdx(col);
    for(var i=0;i<mrg.length;i++){var m=mrg[i];if(l>=m.r1&&l<=m.r2&&ci>m.c1&&ci<=m.c2)return false}
    return true;
  }
  var titulos=[];
  rows.slice().sort(function(a,b){return a.linha-b.linha}).forEach(function(r){
    var t=normK(r.cols.B||'');
    if(/^modulo\d+/.test(t))titulos.push({linha:r.linha,n:parseInt(t.replace(/\D/g,'').slice(0,2),10)});
  });
  if(!titulos.length)return null;
  var res={mods:{}},prev=0,maxL=Math.max.apply(null,rows.map(function(r){return r.linha}));
  titulos.forEach(function(t,i){
    var n=t.n;if(n<=prev)n=prev+1;prev=n;   // título repetido (ex.: dois "51"): segue a sequência dos módulos
    var mod='Módulo '+n,fim=(titulos[i+1]?titulos[i+1].linha-1:maxL);
    var ent=res.mods[mod]={1:{prazo:{},entregue:{},aulas:['','','','']},2:{prazo:{},entregue:{},aulas:['','','','']}};
    for(var l=t.linha+1;l<=fim;l++){
      var cl=porLinha[l]||{},b=normK(cl.B||''),am=/^aula0*(\d+)$/.exec(normK(cl.J||''));
      if(am){var an=parseInt(am[1],10);if(an>=1&&an<=4){ent[1].aulas[an-1]=dataIso(val(l,'K'));ent[2].aulas[an-1]=dataIso(val(l,'L'))}}
      var ats=null;
      if(b==='mapa')ats=['MAPA'];else if(b==='ae2')ats=['AE2'];else if(b==='ae3')ats=['AE3'];
      else if(b.indexOf('slides')>=0)ats=['Slides'];
      else if(b.indexOf('videoexplicativo')>=0&&b.indexOf('ae1')<0)ats=['Vídeos explicativos'];
      else if(b.indexOf('estudodecaso')>=0)ats=['Estudo de caso'];
      if(!ats)continue;
      [[1,'E','F'],[2,'G','H']].forEach(function(dc){
        var pz=dataIso(val(l,dc[1])),en=dataIso(val(l,dc[2])),tg=ent[dc[0]],col=temColuna(l,dc[2]);
        ats.forEach(function(a){
          if(a==='Vídeos explicativos'){   // uma data só para os dois vídeos
            if(!tg.prazo[a])tg.prazo[a]=pz;
            if(col&&!tg.entregue[a])tg.entregue[a]=en;
          }else{
            tg.prazo[a]=pz;
            if(col)tg.entregue[a]=en;
          }
        });
      });
    }
    // regra da coordenação, valendo para todos os módulos (com ou sem células mescladas):
    // AE2 e AE3 têm sempre a mesma data (Data limite e Data entrega)
    [1,2].forEach(function(o){
      [['AE2','AE3']].forEach(function(par){
        ['prazo','entregue'].forEach(function(k){
          var tg=ent[o][k];
          if(!tg[par[0]]&&tg[par[1]])tg[par[0]]=tg[par[1]];
          else if(!tg[par[1]]&&tg[par[0]])tg[par[1]]=tg[par[0]];
        });
      });
    });
  });
  return res;
}
function lerDatasPlanilha(forcar){
  var agora=Date.now();
  if(!forcar&&S._dp&&agora-S._dp.t<20000)return S._dp.p;
  var p=lerDatasPlanilhaSemCache().then(function(b){S._dpDados=b;return b});
  S._dp={t:agora,p:p};
  p.catch(function(){if(S._dp&&S._dp.p===p)S._dp=null});
  return p;
}
function lerDatasPlanilhaSemCache(){
  if(entregasLocalDisponivel())return Promise.resolve({mods:{},legado:{},professor:null,entregas:entregasLocalCompleta()});
  var cfg=S.data.config.sync||{};
  var fid=cfg.fileId||((/\/d\/([-\w]{20,})/.exec(cfg.arquivo||'')||[])[1]);
  if(!fid)return Promise.reject({code:'sem_arquivo'});
  return driveCall('download_file_content',{fileId:fid,exportMimeType:XLSX_MIME}).then(function(p){
    var b64=p&&typeof p==='object'?p.content:null;
    if(typeof b64!=='string'||b64.length<100)throw {code:'xlsx_invalido'};
    return xlsxAbas(b64Bytes(b64));
  }).then(function(abas){
    var nD=abaPorNome(abas,'datasdeentrega'),nE=abaPorNome(abas,'entregas');
    if(!nD&&!nE)throw {code:'sem_aba_datas'};
    var res=nD?parseDatasEntrega(abas[nD]):{mods:{},legado:{},professor:null};
    res.entregas=nE?parseEntregasAba(abas[nE]):null;
    return res;
  });
}

function discsDoProf(pid){
  var m={};
  Object.keys(S.data.entregas).forEach(function(i){var e=S.data.entregas[i];if(e.professorId===pid)m[e.disciplinaId]=1});
  Object.keys(S.data.alocacoes).forEach(function(k){var a=S.data.alocacoes[k];if(a.professorId===pid)m[a.disciplinaId]=1});
  return Object.keys(m).map(function(id){return S.data.disciplinas[id]}).filter(Boolean)
    .sort(function(a,b){return natural(a.modulo||'',b.modulo||'')||String(a.nome).localeCompare(String(b.nome),'pt-BR')})
    .map(function(d){return d.nome;}).concat(coordsDoProf(pid).map(coordsTxt));
}
function modulosDoProf(pid){
  var m={};
  Object.keys(S.data.entregas).forEach(function(i){var e=S.data.entregas[i];if(e.professorId===pid){var d=S.data.disciplinas[e.disciplinaId];if(d&&d.modulo)m[d.modulo]=1}});
  Object.keys(S.data.alocacoes).forEach(function(k){var a=S.data.alocacoes[k];if(a.professorId===pid){var d=S.data.disciplinas[a.disciplinaId];if(d&&d.modulo)m[d.modulo]=1}});
  coordsDoProf(pid).forEach(function(c){if(c.modulo)m[c.modulo]=1});
  return Object.keys(m).sort(natural);

// Na carga de todo professor (formador ou regente), o que conta são as aulas semanais: cada dia da semana marcado na
// alocação é uma disciplina com aula toda semana, ou seja, 4 aulas — segunda e quarta numa mesma alocação valem 8.
// Disciplina Estendida: cada dia da semana marcado vale 9 aulas.
function diasDaAlocacao(a){
  var porDia=a.tipo==='estendida'?9:4;
  if(a.diasSemana&&a.diasSemana.length)return a.diasSemana.length*porDia;
  var set={};
  (a.datasAulas||[]).forEach(function(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');if(m)set[new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay()]=1});
  // sem dias e sem datas informados (ex.: alocação importada da planilha): conta ao menos 1 dia de aula
  return Math.max(1,Object.keys(set).length)*porDia;
}
function aulasProf(pid){
  var n=0;
  Object.keys(S.data.alocacoes).forEach(function(k){var a=S.data.alocacoes[k];if(a&&a.professorId===pid)n+=diasDaAlocacao(a)});
  coordsDoProf(pid).forEach(function(c){n+=diasDaAlocacao(c)});
  return n;
}

/* ---------- score do professor ----------
   Critério 1 (prazos): cada entrega vale 10; perde 0,5 ponto por dia de atraso (20 dias ou mais = 0).
   Entrega feita: atraso = entregue − prazo. Entrega pendente com prazo vencido: atraso = hoje − prazo.
   Pendentes ainda dentro do prazo não entram. Considera todas as entregas e disciplinas do professor. */
var SCORE_PEN_DIA=0.5;
function scoreProf(pid){return scoreDe(function(e){return e.professorId===pid})}
// score do mediador: entregas dos professores e disciplinas que ele acompanha
function scoreMediador(mid){var ch={};alocacoesDoMediador(mid).forEach(function(a){ch[a.professorId+'__'+a.disciplinaId]=1});return scoreDe(function(e){return !!ch[e.professorId+'__'+e.disciplinaId]})}
function scoreDe(filtro){
  var n=0,soma=0,atr=0,diasTot=0;
  Object.keys(S.data.entregas).forEach(function(k){
    var e=S.data.entregas[k];
    if(!filtro(e)||!e.prazo||!peAnoOk(e.prazo))return;
    var fim=e.entregueEm&&peAnoOk(e.entregueEm)?e.entregueEm:null;
    var d;
    if(fim)d=Math.max(0,diasEntre(e.prazo,fim));
    else{var v=diasEntre(e.prazo,hoje());if(v<=0)return;d=v}
    n++;if(d>0){atr++;diasTot+=d}
    soma+=Math.max(0,10-SCORE_PEN_DIA*d);
  });
  if(!n)return null;
  return {nota:Math.round(soma/n*10)/10,n:n,atrasadas:atr,mediaAtraso:atr?Math.round(diasTot/atr*10)/10:0};
}
function scoreCls(v){return v>=9?'ok':(v>=7?'warn':'bad')}
function scoreTxt(v){return v.toFixed(1).replace('.',',')}
/* ---------- Distribuição: habilitação dos professores e alocação automática ---------- */
// Unidade = uma oferta a preencher: disciplinas com o mesmo nome no mesmo módulo, ano, ordem e horário (sinérgicas) + modalidade.

function distUnidades(){

    var d=S.data.disciplinas[id],c=S.data.cursos[d.cursoId];if(!d||!d.nome)return;
    var mods=cursoInst(c)?['ead','estendida']:[distEhEstendida(d)?'estendida':'ead'];
    mods.forEach(function(m){
      var k=[sinChave(d),m].join('|');   // mesma disciplina (sinérgica) = um só professor por modalidade, mesmo com horários ou matrizes diferentes
      var r0=sinRaiz(d)||d,u=g[k]=g[k]||{k:k,chave:chaveDisc(r0.nome),nome:r0.nome,modulo:d.modulo||'',ano:d.ano||'',ordem:temValor(d.ordem)?d.ordem:'',hora:m==='estendida'&&!distEhEstendida(d)?'Estendida':(d.hora||''),mod:m,discs:[],inst:false,horas:{}};
      u.discs.push(id);u.horas[m==='estendida'?'est':distHoraK(d)]=1;u.slotsT=u.slotsT||{};u.slotsT[[d.modulo||'',String(temValor(d.ordem)?d.ordem:''),m==='estendida'?'est':distHoraK(d)].join('|')]=1;if(cursoInst(c))u.inst=true;

  return Object.keys(g).map(function(k){var u=g[k];u.aulas=NAULAS[u.mod]*(u.inst?DIAS_SEM.length:1);return u})
    .sort(function(a,b){return natural(a.modulo,b.modulo)||anoNum(a.ano)-anoNum(b.ano)||(Number(a.ordem)||99)-(Number(b.ordem)||99)||a.nome.localeCompare(b.nome,'pt-BR')||a.mod.localeCompare(b.mod)});
}
function distSlot(u){return [u.modulo,String(u.ordem),u.mod==='estendida'?'est':norm(u.hora||'').replace(/\s/g,'')].join('|')}
// todos os horários ocupados pela unidade (a mesma disciplina pode ter horários diferentes em cada curso)
function distSlots(u){if(u.slotsT&&Object.keys(u.slotsT).length)return Object.keys(u.slotsT);var hs=u.horas?Object.keys(u.horas):[];if(!hs.length)return [distSlot(u)];return hs.map(function(h){return [u.modulo,String(u.ordem),u.mod==='estendida'?'est':h].join('|')})}
// alocação já existente que cobre a unidade (mesma disciplina e mesma modalidade)
function distAlocDe(u){
  var ids={};u.discs.forEach(function(i){ids[i]=1});
  return Object.keys(S.data.alocacoes).map(function(k){return S.data.alocacoes[k]}).filter(function(a){
    if(!ids[a.disciplinaId])return false;
    var t=a.tipo||(distEhEstendida(S.data.disciplinas[a.disciplinaId]||{})?'estendida':'ead');

}
function distCapacidade(p){

  if(temValor(p.discPrevistas))return Number(p.discPrevistas)*4;
  return Infinity;
}
function distProfs(){return Object.keys(S.data.pessoas).map(function(i){return S.data.pessoas[i]}).filter(function(p){return p.papel!=='mediador'}).sort(byNome)}
// Gera a proposta: preenche as unidades sem professor, das mais difíceis (menos professores habilitados) para as mais fáceis
function distGerar(){

    var h=distHab(p.id);
    est[p.id]={p:p,cap:distCapacidade(p),lim:limiteMinhas(p),minhas:discMinhasProf(p.id),tot:cargaProf(p.id),dp:temValor(p.discPrevistas)?Number(p.discPrevistas):null,uso:aulasProf(p.id),slots:slots,hab:{ead:h.ead,estendida:h.estendida},fix:h.fixas,dias:h.dias.length?h.dias:DIAS_SEM.map(function(x){return x[0]}),n:0};
  });
  var abertas=[],feitas=[];
  us.forEach(function(u){var a=distAlocDe(u);if(a)feitas.push({u:u,pid:a.professorId,existente:true});else abertas.push(u)});
  function hab(u){return profs.filter(function(p){return est[p.id].hab[u.mod].indexOf(u.chave)>=0&&podeAlocar(p,u.inst,u.mod)})}
  function todosDias(e){return DIAS_SEM.every(function(x){return e.dias.indexOf(x[0])>=0})}
  // afinidade 0 a 3 (3 = já lecionou a disciplina ou equivalente), vinda dos currículos e do histórico de cada professor
  function afin(p,u){var a=(S.data.afinidades||{})[p.id];return a&&a.notas&&a.notas[u.chave]?Number(a.notas[u.chave])||0:0}
  function cabeLim(e){return (e.lim===null||e.minhas+e.n<e.lim)&&(e.dp===null||e.tot+e.n<e.dp)}
  function livreSlots(e,u){return distSlots(u).every(function(k){return !e.slots[k]})}
  function cabe(e,u){return cabeLim(e)&&e.uso+u.aulas<=e.cap&&livreSlots(e,u)&&(!u.inst||todosDias(e))}
  function sobra(e){return e.cap===Infinity?9999-e.uso:e.cap-e.uso}

  abertas=abertas.filter(function(u){

    if(!fx.length)return true;

    var e=est[p.id],acimaLim=!cabeLim(e),acima=e.uso+u.aulas>e.cap,semDias=u.inst&&!todosDias(e);poe(e,u);
    prop.push({u:u,pid:p.id,fixo:true,aviso:(fx.length>1?'Fixada também para '+fx.filter(function(q){return q.id!==p.id}).map(function(q){return q.nome}).join(', ')+'. ':'')+(acimaLim?'Passa do limite de '+e.lim+' disciplinas com você. ':'')+(acima?'Passa da carga do contrato. ':'')+(semDias?'Institucional exige 2ª a 5ª feira, e o professor não marcou todos esses dias.':'')});
    return false;

  // professor que pode receber u: direto (tem aula sobrando e não tem conflito) ou passando uma disciplina dele para outro habilitado (até 3 trocas em cadeia)
  function tentar(u,vis,prof){
    var cands=hab(u).filter(function(p){return !vis[p.id]});
    var livres=cands.filter(function(p){return cabe(est[p.id],u)}).sort(function(x,y){return afin(y,u)-afin(x,u)||sobra(est[y.id])-sobra(est[x.id])||est[x.id].n-est[y.id].n||byNome(x,y)});

  pedirConfirmacao(!novo?'Tirar o professor?':(velha?'Trocar o professor?':'Alocar o professor?'),txt,!novo?'Tirar':(velha?'Trocar':'Alocar')).then(function(ok){

    var hist={disciplinaId:baseDid,disciplina:d.nome||'',modulo:d.modulo||'',ano:d.ano||'',ordem:temValor(d.ordem)?d.ordem:null,tipo:tipo,

  });

    case 'edit-disc':abrirDisc(id);break;

    case 'portal-ok':portalMarcar(el.getAttribute('data-id'));break;
    case 'portal-desf':portalDesfazer(el.getAttribute('data-id'));break;
    case 'portal-cod':var cv=(document.getElementById('portal-cod-in')||{}).value||'';var mm=/([\w-]+)\.([a-z0-9]+)\s*$/i.exec(cv.trim());if(mm&&codProf(mm[1])===mm[2].toLowerCase()){S.portal={pid:mm[1]};try{localStorage.setItem('gdPortal',mm[1]+'.'+mm[2].toLowerCase())}catch(e){}if(!S.loaded.confirmacoes&&S.db)ouvir('confirmacoes');render()}else toast('Código inválido. Confira o código enviado pela coordenação.',true);break;
    case 'csv':exportarCSV();break;
    case 'backup':exportarBackup();break;
    case 'hoje':G('f-feito').value=hoje();if(dlg._feitoManual)dlg._feitoManual();dlg._onInput&&dlg._onInput();break;
    case 'limpar-data':G('f-feito').value='';if(dlg._feitoManual)dlg._feitoManual();dlg._onInput&&dlg._onInput();break;
    case 'dlg-salvar':if(dlg._salvar)dlg._salvar();break;
    case 'dlg-excluir':if(dlg._excluir)dlg._excluir();break;
    case 'dlg-fechar':fechar();break;
    case 'c-sim':if(S.cres){var r=S.cres;S.cres=null;dlgc.close();r(true)}break;
    case 'c-nao':dlgc.close();break;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t&&t.hasAttribute){
    if(t.hasAttribute('data-seldisc')){
      var kd=t.getAttribute('data-seldisc').split('|');
      marcarGrupo(kd[0],kd[1],t.checked);
      render();return;
    }
    if(t.hasAttribute('data-selprof')){
      var pidS=t.getAttribute('data-selprof');
      gruposVisiveis(baseRows()).filter(function(g){return g.pid===pidS}).forEach(function(g){marcarGrupo(g.pid,g.did,t.checked)});
      render();return;
    }
    if(t.id==='sel-todos'){
      gruposVisiveis(baseRows()).forEach(function(g){marcarGrupo(g.pid,g.did,t.checked)});
      render();return;
    }
    if(t.hasAttribute('data-bd-id')){
      var bdId=t.getAttribute('data-bd-id'),bdCampo=t.getAttribute('data-bd-campo'),bdVal=t.value;
      if(bdCampo==='ordem'){bdVal=bdVal===''?null:parseInt(bdVal,10);if(bdVal!==null&&Number.isNaN(bdVal)){toast('A ordem deve ser um número.',true);render();return}}
      else bdVal=String(bdVal).trim();
      var bdPatch={};bdPatch[bdCampo]=bdVal;
      t.disabled=true;
      dbTentar(function(){return S.db.doc('disciplinas/'+bdId).update(bdPatch)}).then(function(){toast('Salvo.')}).catch(function(err){toast(msgErro(err),true)}).then(function(){render()});
      return;
    }
    if(t.hasAttribute('data-ge-id')){
      return;   // as datas só são salvas ao clicar em "Atualizar", no cabeçalho do módulo
    }
  }
  var m={'ff-curso':'curso','ff-modulo':'modulo','ff-disciplina':'disciplina','ff-mediador':'mediador','ff-situacao':'status'}[ev.target.id];
  if(!m)return;
  S.f[m]=ev.target.value;
  if(m==='curso'&&S.f.disciplina){
    var d=S.data.disciplinas[S.f.disciplina];
    if(!d||(S.f.curso&&d.cursoId!==S.f.curso))S.f.disciplina='';
  }
  render();
});
$('#ff-q').addEventListener('input',function(ev){S.f.q=ev.target.value.trim();render()});

/* ---------- inicialização ---------- */
function campoEmEdicao(){
  var el=document.activeElement;
  if(!el||(el.tagName!=='INPUT'&&el.tagName!=='SELECT'&&el.tagName!=='TEXTAREA'))return false;
  if(el.tagName==='INPUT'&&(el.type==='checkbox'||el.type==='radio'))return false;
  return !!(el.closest('#conteudo')||el.closest('dialog'));
}
function ouvir(nome){
  S.db.collection(nome).onSnapshot(function(snap){
    var m={};
    snap.docs.forEach(function(d){var v=d.data()||{};if(nome==='entregas'&&v.atividade==='AE1')return;m[d.id]=Object.assign({id:d.id},v)});   // AE1 deixou de ser encomendada
    S.data[nome]=m;S.loaded[nome]=true;
    // na tela de Entregas, nada de fundo reconstrói a grade: só ao clicar em "Atualizar" (evita perder datas digitadas e ainda não salvas)
    if(S.tab==='cadastros'&&S.sub==='entregas'){S._renderAdiado=true;return}
    render();
  },function(err){if(nome==='afinidades'){S.data.afinidades={};return}S.err=err;render()});
}
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(!t.classList||!t.classList.contains('ge-cel'))return;
  // AE2/AE3 compartilham o mesmo campo: mantém as duas linhas iguais enquanto o usuário digita, sem salvar nada
  var docId=t.getAttribute('data-ge-id'),caminho=t.getAttribute('data-ge-path');
  if(!docId||!caminho)return;
  document.querySelectorAll('input.ge-cel[data-ge-id="'+CSS.escape(docId)+'"][data-ge-path="'+CSS.escape(caminho)+'"]').forEach(function(irmao){
    if(irmao!==t)irmao.value=t.value;
  });
});
document.addEventListener('focusout',function(){
  setTimeout(function(){
    if(S.tab==='cadastros'&&S.sub==='entregas')return;   // só sai do modo "aguardando Atualizar" ao trocar de aba
    if(S._renderAdiado&&!campoEmEdicao()){S._renderAdiado=false;render()}
  },0);
});

/* ---------- portal do professor: marca a entrega e a data entra no painel ---------- */
var URL_GD='gestao-docente.html';
function codProf(pid){var s=String(pid)+'|gd-entregas',x=7;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x.toString(36).slice(-5)}
(function(){var src=(location.hash||'')+'&'+(location.search||'');try{src+='&p='+(localStorage.getItem('gdPortal')||'')}catch(e){}var m=/[#?&]p=([\w-]+)\.([a-z0-9]+)/i.exec(src);if(m&&codProf(m[1])===m[2].toLowerCase())S.portal={pid:m[1]}})();
function linkProf(pid){return URL_GD+'#p='+pid+'.'+codProf(pid)}
function abrirLinkProf(pid){var p=S.data.pessoas[pid];if(!p)return;var lk=linkProf(pid),cod=pid+'.'+codProf(pid);
  var corpo='Olá, '+p.nome.split(' ')[0]+'!\n\nPara registrar suas entregas, acesse o link abaixo e clique em "Entreguei" em cada atividade concluída. A data é registrada automaticamente no controle da coordenação.\n\n'+lk+'\n\nAo abrir o link, informe o código: '+cod+'\n\n(É preciso entrar com uma conta Claude, gratuita.)\n\nAtenciosamente,\nProf. Fabio Iba';
  var mt='mailto:'+encodeURIComponent(p.email||'')+'?cc='+encodeURIComponent('fabio.iba@unicesumar.edu.br;nayara.shimada@unicesumar.edu.br')+'&subject='+encodeURIComponent('Registro das suas entregas')+'&body='+encodeURIComponent(corpo);
  var d=document.createElement('dialog');d.innerHTML='<div class="dlg-in"><h2>Link de entregas · '+esc(p.nome)+'</h2><p class="muted" style="margin-bottom:10px">O professor abre o link, vê só as entregas dele e clica em "Entreguei". A data entra sozinha neste painel.</p><div class="fld full"><label>Link</label><input readonly value="'+esc(lk)+'" id="lk-prof"></div><div class="fld full" style="margin-top:8px"><label>Código (se o link não abrir direto)</label><input readonly value="'+esc(cod)+'"></div><div class="dlg-foot"><button class="btn" type="button" id="lk-cop">Copiar link</button><a class="btn primary" style="text-decoration:none" href="'+esc(mt)+'" target="_blank" rel="noopener">Enviar pelo Outlook</a><button class="btn" type="button" data-act="portal-ver" data-id="'+esc(pid)+'">Ver como o professor</button><span class="grow"></span><button class="btn" type="button" id="lk-fe">Fechar</button></div></div>';
  document.body.appendChild(d);d.querySelector('#lk-fe').onclick=function(){d.close()};d.addEventListener('close',function(){d.remove()});
  d.querySelector('#lk-cop').onclick=function(){var i=d.querySelector('#lk-prof');i.select();try{navigator.clipboard.writeText(lk).then(function(){toast('Link copiado.')},function(){document.execCommand('copy');toast('Link copiado.')})}catch(e){document.execCommand('copy');toast('Link copiado.')}};
  d.showModal();
}
function desenharEntradaPortal(){var w=document.querySelector('.wrap');if(document.getElementById('portal-cod-in'))return;
  w.innerHTML='<header class="top"><div><h1><span class="top-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>Minhas entregas</h1></div></header><div class="vazio" style="max-width:560px"><h2>Informe o seu código</h2><p>Digite o código enviado pela coordenação no e-mail da alocação. Ele fica guardado neste navegador para os próximos acessos.</p><div class="linha"><input id="portal-cod-in" placeholder="Ex.: nome-do-professor.ab12c"><button class="btn primary" type="button" data-act="portal-cod">Entrar</button></div>'+'</div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
  var i=document.getElementById('portal-cod-in');i.addEventListener('keydown',function(ev){if(ev.key==='Enter'){var b=document.querySelector('[data-act=portal-cod]');b&&b.click()}})}
function desenharPortal(){
  var w=document.querySelector('.wrap'),pid=S.portal.pid,p=S.data.pessoas[pid]||{nome:''},C=S.data.confirmacoes||{};
  var es=Object.keys(S.data.entregas).map(function(k){return S.data.entregas[k]}).filter(function(e){return e.professorId===pid});
  es.sort(function(a,b){return String(a.prazo||'9').localeCompare(String(b.prazo||'9'))});
  var linhas=es.map(function(e){var d=S.data.disciplinas[e.disciplinaId]||{},c=C[e.id],ent=c?c.data:e.entregueEm,hj=hoje();
    var sit=ent?'<span class="badge s-concluida">Entregue em '+fmtBR(ent)+'</span>'+(c&&c.data===hj?' <button class="lk-mini perigo" type="button" data-act="portal-desf" data-id="'+esc(e.id)+'" style="display:inline">desfazer</button>':''):(e.prazo&&e.prazo<hj?'<span class="badge s-atrasada">Atrasada</span>':'<span class="badge s-a_entregar">A entregar</span>');
    return '<tr data-d="'+esc(e.disciplinaId)+'"><td>'+esc(e.atividade||'')+'</td><td class="nw">'+(e.prazo?fmtBR(e.prazo):'—')+'</td><td>'+sit+'</td><td>'+(ent?'':'<button class="btn primary mini" type="button" data-act="portal-ok" data-id="'+esc(e.id)+'">Entreguei</button>')+'</td></tr>'}).join('');
  var carreg=!S.loaded.entregas||!S.loaded.pessoas;
  w.innerHTML='<header class="top"><div><h1><span class="top-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>Minhas entregas</h1></div><div class="acoes"><button class="btn" type="button" data-act="portal-sair">'+(S.isOwner?'Voltar ao painel':'Trocar código')+'</button></div></header>'
    +(S.noDb?'<div class="vazio"><h2>Entre com sua conta</h2><p>Para registrar as entregas, abra este link com sua conta Claude (gratuita) conectada.</p></div>'
    :carreg?'<p class="carregando">Carregando suas entregas…</p>'
    :'<p style="margin:0 0 12px;font-size:15px">Prof(a). <b>'+esc(p.nome||'')+'</b> · clique em <b>Entreguei</b> quando concluir cada atividade. A data de hoje é registrada automaticamente.</p>'
     +(es.length?(function(){var tmp=document.createElement('tbody');tmp.innerHTML=linhas;var ord=[];es.forEach(function(e){if(ord.indexOf(e.disciplinaId)<0)ord.push(e.disciplinaId)});
        return ord.map(function(did){var d=S.data.disciplinas[did]||{};var rows=[].slice.call(tmp.querySelectorAll('tr')).filter(function(r){return r.getAttribute('data-d')===did}).map(function(r){return r.outerHTML}).join('');
          return '<h2 style="font-size:17px;margin:18px 0 8px">'+esc(d.nome||'Disciplina')+(d.modulo?' <span class="muted" style="font-weight:600">· '+esc(d.modulo)+'</span>':'')+'</h2><div class="tabela-wrap"><table class="lista"><thead><tr><th>Entrega</th><th>Prazo</th><th>Situação</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'}).join('')})():'<div class="vazio"><h2>Nenhuma entrega encomendada</h2><p>Quando a coordenação alocar suas disciplinas, as entregas aparecem aqui.</p></div>'))+'<div class="toast" id="toast" role="status" aria-live="polite"></div>';
}
function portalMarcar(eid){var e=S.data.entregas[eid];if(!e||!S.db)return;var c={entregaId:eid,professorId:S.portal.pid,data:hoje(),em:new Date().toISOString()};
  S.db.doc('confirmacoes/'+eid).set(c).then(function(){S.data.confirmacoes[eid]=Object.assign({id:eid},c);toast('Entrega registrada em '+fmtBR(c.data)+'. Obrigado!');render()}).catch(function(err){var c=err&&err.code||'';toast(/permission|denied|not_granted|forbidden|not_writer|readonly|read_only/i.test(c+' '+(err&&err.message||''))?'Seu acesso a este painel está como "só visualizar". A coordenação precisa liberar o acesso para interagir.':'Não foi possível registrar ('+(c||'erro')+(err&&err.message?': '+err.message:'')+'). Tente de novo.',true)})}
function portalDesfazer(eid){if(!S.db)return;S.db.doc('confirmacoes/'+eid).delete().then(function(){delete S.data.confirmacoes[eid];toast('Registro desfeito.');render()}).catch(function(){toast('Não foi possível desfazer.',true)})}
// coordenação: confirmações dos professores viram a data de entrega no controle
function aplicarConfirmacoes(){if(S.portal||!(S.isAdmin&&S.canWrite)||!S.loaded.confirmacoes||!S.loaded.entregas||S._apConf)return;var C=S.data.confirmacoes,ps=[];
  Object.keys(C).forEach(function(id){var c=C[id],e=S.data.entregas[id];if(!e||!c.data||e.entregueEm===c.data)return;if(e.entregueEm&&e.confirmadoPor!=='professor')return;
    ps.push(S.db.doc('entregas/'+id).update({entregueEm:c.data,entregueManual:true,confirmadoPor:'professor',confirmadoEm:c.em||''}).then(function(){e.entregueEm=c.data;e.entregueManual=true;e.confirmadoPor='professor'}))});
  Object.keys(S.data.entregas).forEach(function(id){var e=S.data.entregas[id];if(e.confirmadoPor==='professor'&&e.entregueEm&&!C[id])ps.push(S.db.doc('entregas/'+id).update({entregueEm:'',confirmadoPor:''}).then(function(){e.entregueEm='';e.confirmadoPor=''}))});
  if(ps.length){S._apConf=true;Promise.all(ps).then(function(){S._apConf=false;toast(ps.length+' '+(ps.length===1?'entrega confirmada pelo professor foi registrada':'entregas confirmadas pelos professores foram registradas')+'.');render()},function(){S._apConf=false})}}
async function init(){
  render();
  if(!window.claude||typeof window.claude.use!=='function'){S.noDb=true;render();return}
  try{
    var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    S.db=res[0];S.user=res[1];
  }catch(_){S.db=null}
  if(!S.db){S.noDb=true;render();return}
  S.authOk=true;S.isOwner=false;
  if(S.user){
    try{
      S.me=await S.user.me();
      S.isAdmin=await S.user.canEdit();
      try{S.isOwner=await S.user.isOwner()}catch(_){S.isOwner=false}
      
      var cw=await S.user.can('data.write');
      S.canWrite=cw!==false;
    }catch(_){}
  }
  if(S.portal){['disciplinas','pessoas','entregas','confirmacoes'].forEach(ouvir);render();return}
  ['cursos','disciplinas','pessoas','entregas','envios','avisos','alocacoes','config','gradeEntregas','coords','habilitacoes','confirmacoes'].forEach(ouvir);
  try{ouvir('afinidades')}catch(e){}   // afinidade professor x disciplina (currículo e histórico): só usada pela Distribuição, nunca exibida
  render();
}
init();
})();
