}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#191527;--surface:#221D38;--soft:#2A2444;--ink:#F1EEFB;--muted:#BCB4DA;--line:#362E56;
  --accent:#4CC7C2;--accent-s:#12302F;--accent-ink:#191527;--accent-strong:#8FE0DA;
  --ok:#5FD09B;--ok-s:#15382B;--warn:#F4B740;--warn-s:#43320F;--bad:#FF8F86;--bad-s:#45201D;--info:#8FE0DA;--info-s:#12302F;
  --btn-line:#4B4470;--shadow:0 2px 14px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#191527;--surface:#221D38;--soft:#2A2444;--ink:#F1EEFB;--muted:#BCB4DA;--line:#362E56;
  --accent:#4CC7C2;--accent-s:#12302F;--accent-ink:#191527;--accent-strong:#8FE0DA;
  --ok:#5FD09B;--ok-s:#15382B;--warn:#F4B740;--warn-s:#43320F;--bad:#FF8F86;--bad-s:#45201D;--info:#8FE0DA;--info-s:#12302F;
  --btn-line:#4B4470;--shadow:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{color:var(--ink);font:400 14px/1.45 var(--body);font-variant-numeric:tabular-nums;min-height:100vh;
  background:radial-gradient(circle at 8% 0%,rgba(15,110,122,.10) 0%,transparent 38%),radial-gradient(circle at 92% 8%,rgba(47,128,237,.10) 0%,transparent 40%),radial-gradient(circle at 50% 100%,rgba(12,166,120,.08) 0%,transparent 45%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap-top{padding-block:22px 0}

.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;padding:26px 28px;border-radius:20px;background:linear-gradient(135deg,#12808A 0%,#0F6E7A 38%,#1D6FA3 100%);box-shadow:0 12px 32px rgba(11,79,92,.32),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden}

.top>*{position:relative}
.top h1{color:#fff;font-size:clamp(1.5rem,3vw,2.05rem);font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:12px;text-shadow:0 1px 12px rgba(0,0,0,.12)}
.top-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

.tabs button[aria-pressed="true"]{background:linear-gradient(135deg,#0F6E7A,#1D6FA3);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(11,79,92,.32)}

main{padding-block:18px 64px}

.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin:0 0 12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

.mut{color:var(--muted);font-size:13px}

.btn-redondo{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#0F6E7A;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 6px 16px -6px rgba(11,79,92,.45);transition:transform .15s ease,box-shadow .15s ease;text-decoration:none;flex:none}

.btn-redondo svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-redondo:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn-redondo .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#0F6E7A;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.btn-redondo{position:relative}
.acoes{align-items:center}
.btn-home{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#111;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 6px 16px -6px rgba(8,30,40,.45);transition:transform .15s ease;align-self:flex-end;flex:none}

#tabs[hidden]{display:none!important}
.part-add{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.part-add select{max-width:460px}
.cc-pie{display:flex;align-items:center;gap:16px;margin:4px 0}.ccard{--pc:#0F6E7A}.ccard.ok{--pc:#1E9E63}
.pie{width:118px;height:118px;border-radius:50%;flex:none;background:conic-gradient(var(--pc) calc(var(--p)*1%),#F6D9D5 0);display:grid;place-items:center}
.pie span{width:78px;height:78px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}.pie b{font:800 1.35rem/1 var(--display);color:var(--pc)}.pie small{font-size:11px;color:var(--muted)}
.pie-leg{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}.pie-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ccard{padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--accent)}.ccard.ok{border-top-color:var(--ok)}.ccard.on{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.cc-t{font:700 16px/1.2 var(--display)}.cc-d{font-size:12.5px;min-height:32px}
.cc-n{display:flex;align-items:baseline;gap:6px}.cc-n b{font:800 2rem/1 var(--display);color:var(--accent-strong)}.ccard.ok .cc-n b{color:var(--ok)}.cc-n span{color:var(--muted);font-size:13px}
.cc-r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.cc-p{color:var(--bad);font-weight:600}.ccard.ok .cc-p{color:var(--ok)}
.cc-b{margin-top:2px;border:0;background:none;padding:0;cursor:pointer;align-self:flex-start;font-size:13px}
.arq-ok{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:36px 22px 30px}.arq-ok b{font-size:18px}.arq-ck{width:64px;height:64px;border-radius:50%;background:var(--ok-s);display:grid;place-items:center}.arq-ck svg{width:34px;height:34px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.arq-ok .btn{margin-top:8px}
.ass-ed{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-weight:500}.ass-ed img{max-height:56px;max-width:200px;background:#fff}
.va-sig{max-height:52px;max-width:200px;width:auto;align-self:flex-start;margin-left:30px;margin-bottom:-2px}
.figs{display:flex;flex-direction:column;gap:6px;margin-top:8px}.fig-it{display:flex;align-items:center;gap:10px;border:1px solid var(--line,#ddd);border-radius:10px;padding:6px 8px}.fig-it img{width:72px;height:54px;object-fit:cover;border-radius:6px}.fig-c{flex:1;display:flex;flex-direction:column;gap:4px}.fig-c input{width:100%}
.va-it{display:flex;gap:8px;margin:2px 0 4px 6px}.va-fig{margin:10px auto;text-align:center}.va-fig img{max-width:80%;max-height:380px}.va-fig figcaption{font-size:12px;color:#444;margin-top:4px}
.dlg-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.dlg-h h2{margin:0;font-size:18px}
.ver-ata{background:#fff;color:#111;border:1px solid var(--line,#ddd);border-radius:8px;padding:28px 32px;font-size:13.5px;line-height:1.5}

.va-id{width:100%;border-collapse:collapse;margin-bottom:14px}.va-id th,.va-id td{border:1px solid #333;padding:4px 6px;font-size:12px;text-align:left}.va-id th{white-space:nowrap}
.va-bar{background:#e9e9ef;font-weight:700;padding:4px 8px;margin:14px 0 6px;font-size:12.5px}.ver-ata ol{margin:0;padding-left:22px}
.va-ass{display:flex;flex-direction:column;margin-top:44px}.va-ass span{width:260px;border-top:1px solid #111;margin-bottom:4px}.va-ass small{color:#444}
.tabrow{display:flex;align-items:flex-start;gap:8px}.tabrow .tabs{flex:1}.drive-btn{margin:18px 0 0 auto;flex:none;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line,#DCE6EA);display:grid;place-items:center;box-shadow:0 4px 12px -6px rgba(8,30,40,.35);transition:transform .15s}.drive-btn:hover{transform:translateY(-2px)}
.pbar{height:10px;border-radius:99px;background:var(--bad-s);overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0F6E7A,#1D6FA3)}
.falta-it{cursor:pointer}.falta-it[data-abrir-ata]:hover,.falta-it[data-abrir-plano]:hover{text-decoration:underline}
.btn-x{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:18px;font-weight:600;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none}

a.btn{text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;border:0;cursor:pointer;background:var(--soft);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pendente{background:var(--bad-s);color:var(--bad)}

.kpi span{font-size:13px;color:var(--muted)}
.kpi.bad{--kc:var(--bad)}.kpi.warn{--kc:var(--warn)}.kpi.ok{--kc:var(--ok)}.kpi.ac{--kc:var(--accent)}
.alertas{display:flex;flex-direction:column;gap:8px;margin-top:18px}

.alerta.bad .sv{background:var(--bad)}
.vazio{padding:28px;text-align:center;color:var(--muted)}
.vazio b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:4px}

.filtros{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}

dialog{border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(34,29,53,.35);background:var(--surface);color:var(--ink);padding:0;width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog.curto{width:min(520px,calc(100vw - 24px))}dialog.curto .dlg{max-width:none!important}

.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--bad);cursor:pointer;font-weight:700}
.dica{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.ia-box{border:1px dashed var(--info);background:var(--info-s);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink)}

.acao-row select,.acao-row input{min-width:110px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}.toast.err{background:var(--bad);color:#fff}
.copia{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.copia code{background:var(--soft);padding:2px 8px;border-radius:6px;user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* banner: azul-marinho e verde-água (padrão Gestão Fabio Iba) */
.top{position:relative;overflow:hidden;background:radial-gradient(520px 240px at 92% -20%,rgba(76,199,194,.38),transparent 62%),radial-gradient(460px 220px at 8% 140%,rgba(46,134,193,.40),transparent 60%),linear-gradient(115deg,#0B1D2E 0%,#123150 52%,#0F4C5C 100%)!important;box-shadow:0 18px 38px -20px rgba(11,29,46,.65)!important}
.top::before{content:""!important;position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/30px 30px!important;-webkit-mask-image:linear-gradient(90deg,#000 0%,transparent 70%);mask-image:linear-gradient(90deg,#000 0%,transparent 70%);pointer-events:none}
.top::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(76,199,194,.10);pointer-events:none}
.top>*{position:relative;z-index:1}
</style>


<style>
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,340px));gap:18px}
.pj-card{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:24px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 10px 30px -14px rgba(15,27,42,.22);overflow:hidden;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
.pj-card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -16px rgba(15,27,42,.3)}
.badge-chat{position:absolute;top:12px;right:12px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#E03131;color:#fff;font:800 13px Arial,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 6px 14px -4px rgba(224,49,49,.6);z-index:2;animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.badge-chat{animation:none}}
.pj-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#5B4BD6,#9B8FF5)}
.pj-head{display:flex;gap:14px;align-items:center}
.pj-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(140deg,#5B4BD6,#3A2E9E);color:#fff;display:flex;align-items:center;justify-content:center;font:800 22px Manrope,sans-serif;flex:none;overflow:hidden;box-shadow:0 10px 20px -10px #5B4BD6}
.pj-logo.img{background:#fff;border:1px solid var(--line)}.pj-logo img{width:100%;height:100%;object-fit:contain}
.pj-card h2{margin:0;font:800 19px Manrope,sans-serif;line-height:1.2}.pj-card .cat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B4BD6}
.pj-card p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pj-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.pj-meta b{color:var(--ink)}
.pj-go{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#5B4BD6}
.pj-go span.ar{width:32px;height:32px;border-radius:50%;background:#5B4BD6;color:#fff;display:flex;align-items:center;justify-content:center}
.btn-redondo{position:relative}
</style>
<div class="in wrap-top">
  <header class="top">
    <div><h1><span class="top-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h5v14H4zM10 5h5v9h-5zM16 5h4v12h-4z"/></svg></span>Projetos dos Cursos</h1></div>
    <div class="periodo"><a class="btn-home" href="index.html" aria-label="Página inicial" title="Página inicial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a></div>
  </header>
</div>
<main class="in" id="main">
  <div class="status-line"><span class="dot" id="dot"></span><span id="st">Carregando projetos…</span><span class="grow"></span>
    <button class="btn-redondo" type="button" id="novo" aria-label="Novo projeto" title="Novo projeto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div id="view"><div class="card vazio"><b>Carregando</b>Buscando os projetos.</div></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function hoje(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function br(iso){if(!iso)return '—';var p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}
function iniciais(n){return String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0].toUpperCase()}).join('')}
function slug(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||('proj-'+Date.now().toString(36))}
function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast'},3200)}
var P={},E={},C={};
function naoLidas(pid){var lido='';try{lido=localStorage.getItem('gfi_chat_lido_'+pid)||''}catch(e){}return Object.keys(C).map(function(k){return C[k]}).filter(function(m){return m.projetoId===pid&&m.autorId!=='sponsor'&&String(m.em||'')>lido}).length}
function mapa(l){var m={};(l||[]).forEach(function(x){m[x.id]=Object.assign({id:x.id},x.data||{})});return m}
function render(){
  var ps=Object.keys(P).map(function(k){return P[k]}).sort(function(a,b){return String(a.nome).localeCompare(String(b.nome),'pt-BR')});
  if(!ps.length){$('#view').innerHTML='<div class="card vazio"><b>Nenhum projeto ainda</b>Clique no + para criar o primeiro.</div>';return}
  $('#view').innerHTML='<div class="pj-grid">'+ps.map(function(p){
    var eds=Object.keys(E).map(function(k){return E[k]}).filter(function(e){return e.projetoId===p.id}),pub=eds.filter(function(e){return e.status==='publicada'}).length;
    var prox=eds.filter(function(e){return e.dataPublicacao&&e.dataPublicacao>=hoje()&&e.status!=='publicada'}).sort(function(a,b){return a.dataPublicacao.localeCompare(b.dataPublicacao)})[0];
    var eq=(p.equipe||[]).length+(p.coordenador&&p.coordenador.nome?1:0);
    var nl=naoLidas(p.id);
    return '<a class="pj-card" href="projeto.html?p='+encodeURIComponent(p.id)+'">'+(nl?'<span class="badge-chat" title="'+nl+' '+(nl===1?'mensagem nova':'mensagens novas')+' no chat">'+(nl>99?'99+':nl)+'</span>':'')+'<div class="pj-head"><span class="pj-logo'+(p.logo?' img':'')+'">'+(p.logo?'<img src="'+esc(p.logo)+'" alt="">':esc(iniciais(p.nome)))+'</span><div><div class="cat">'+esc(p.tipo||'Projeto')+'</div><h2>'+esc(p.nome)+'</h2></div></div>'
      +(p.descricao?'<p>'+esc(p.descricao)+'</p>':'')
      +'<div class="pj-meta"><span>Coordenação: <b>'+esc((p.coordenador&&p.coordenador.nome)||'—')+'</b></span><span>Equipe: <b>'+eq+'</b></span><span>'+(p.unidade==='Episódio'||(!p.unidade&&/podcast/i.test((p.tipo||'')+' '+(p.nome||'')))?'Episódios':p.unidade==='Ação'?'Ações':p.unidade&&p.unidade!=='Edição'?p.unidade+'s':'Edições')+': <b>'+eds.length+'</b> ('+pub+' publicad'+(p.unidade==='Episódio'||(!p.unidade&&/podcast/i.test((p.tipo||'')+' '+(p.nome||'')))||p.unidade==='Módulo'||p.unidade==='Encontro'||p.unidade==='Evento'?'os':'as')+')</span><span>Próxima publicação: <b>'+(prox?br(prox.dataPublicacao):'—')+'</b></span></div>'
      +(function(){var ms=Object.keys(C).map(function(k){return C[k]}).filter(function(m){return m.projetoId===p.id}).sort(function(a,b){return String(a.em).localeCompare(String(b.em))}),u=ms[ms.length-1];if(!u)return '<div class="pj-meta"><span>💬 Chat: <b>sem mensagens</b></span></div>';var d=new Date(u.em),hh=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);return '<div class="pj-meta" style="'+(nl?'color:#E03131;font-weight:700':'')+'"><span>💬 Chat: <b style="'+(nl?'color:#E03131':'')+'">'+(nl?nl+(nl===1?' nova':' novas'):ms.length+' mensage'+(ms.length===1?'m':'ns'))+'</b> · última de '+esc(String(u.autor||'').split(' ')[0])+' em '+br(new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString())+' '+hh+'</span></div>'})()
      +'<div class="pj-go">Abrir projeto<span class="ar">→</span></div></a>'}).join('')+'</div>';
}
function carregar(){return GFI.api('listMany',{app:'proj',cols:['projetos','edicoes','chat']}).then(function(r){P=mapa((r||{}).projetos);E=mapa((r||{}).edicoes);C=mapa((r||{}).chat);var tot=Object.keys(P).reduce(function(t,k){return t+naoLidas(k)},0);document.title=(tot?'('+tot+') ':'')+'Projetos dos Cursos';$('#dot').className='dot ok';$('#st').textContent='Dados sincronizados · hoje '+br(hoje());render()})}
$('#novo').onclick=function(){var n='Novo projeto',id='proj-'+Date.now().toString(36);this.disabled=true;
  GFI.api('set',{app:'proj',col:'projetos',id:id,data:{nome:n,tipo:'Projeto',descricao:'',coordenador:{id:'coord',nome:'',email:'',funcao:'Coordenação geral'},equipe:[],links:{},criadoEm:new Date().toISOString()}})
   .then(function(){location.href='projeto.html?p='+encodeURIComponent(id)+'&novo=1'}).catch(function(e){toast('Não foi possível criar: '+((e&&e.message)||'erro'),true)})};
carregar().catch(function(e){$('#dot').className='dot bad';$('#st').textContent='Não foi possível ler os projetos: '+((e&&e.message)||'erro')});
setInterval(function(){if(!document.hidden)carregar().catch(function(){})},30000);
window.addEventListener('pageshow',function(){carregar().catch(function(){})});
})();
</script>
